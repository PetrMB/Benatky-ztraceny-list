<script>
/* ============================================================================
 * 60_audio.js — „Ztracený list" • hudba + SFX (čistá WebAudio syntéza)
 * ----------------------------------------------------------------------------
 * Renesanční instrumentace bez jediného externího souboru:
 *   • loutna    — Karplus-Strong (předpočítaný vybuzený string do bufferu)
 *   • flétna    — sinus + zpožděné vibrato + dechový šum (bandpass)
 *   • viola     — dvě rozladěné pily + lowpass, pomalý nástup smyčce
 *   • zvony     — 2-op FM s inharmonickým poměrem 2.76 + spodní „hum" parciála
 *   • skřipky   — pila + výrazné vibrato + formantový bandpass (Bendovy housle)
 *   • sníh-pad  — loopovaný šum přes pomalu dýchající lowpass
 *
 * Leitmotivy dle GAME_DESIGN.md §6: Jiřík (stoupavá kvarta, dorský),
 * Brahe (klesající půltón + zvon), Jizera (perpetuum arpeggio),
 * Benda (skočná). Smyčky plánuje lookahead sekvencer — žádné lupání,
 * crossfade řeší engine (fade-in/out na předaném gain uzlu), stop()
 * jen ukončí plánování a nechá doznít release.
 * Adaptivní vrstvy: části sekvenceru mají `when()` — čtou BNJ.state
 * (flagy / inventář) a vrstva se přidá až po odemčení, beze švů,
 * protože časová osa části běží dál i když je vrstva němá.
 * Master limiter: každý track i SFX jde přes DynamicsCompressor
 * v limiter režimu, aby souzvuky nikdy neclipovaly.
 * Start zvuku až po prvním gestu uživatele zajišťuje engine (audio.unlock).
 * ========================================================================== */
(function () {
  'use strict';
  const audio = window.BNJ.audio;

  /* ------------------------------------------------------------ utility -- */

  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a, b) => a + Math.random() * (b - a);

  const ST = () => (window.BNJ.state || { flags: {}, inventory: [] });
  const hasFlag = (n) => !!ST().flags[n];
  const hasItem = (n) => (ST().inventory || []).indexOf(n) >= 0;
  const anyFragment = () =>
    hasItem('frag_a') || hasItem('frag_b') || hasItem('frag_c') || hasFlag('letter_read');

  /* Sdílený 2s buffer bílého šumu (cache na AudioContext). */
  let _noise = null, _noiseAc = null;
  function noiseBuf(ac) {
    if (_noise && _noiseAc === ac) return _noise;
    const len = Math.floor(ac.sampleRate * 2);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    _noise = buf; _noiseAc = ac;
    return buf;
  }

  /* Limiter — poslední článek každého tracku/SFX před engine gainem. */
  function limiter(ac, out) {
    const c = ac.createDynamicsCompressor();
    c.threshold.value = -9;
    c.knee.value = 6;
    c.ratio.value = 14;
    c.attack.value = 0.003;
    c.release.value = 0.22;
    c.connect(out);
    return c;
  }

  /* --------------------------------------------------- loutna (K-Strong) -- */
  /* Struna se předpočítá do bufferu: šumový úder → kruhový buffer
   * s půleným průměrovacím filtrem (klasický Karplus-Strong).            */
  const _ksCache = new Map();
  let _ksAc = null;
  function ksBuffer(ac, freq, bright) {
    if (_ksAc !== ac) { _ksCache.clear(); _ksAc = ac; }
    const key = Math.round(freq) + '|' + bright;
    if (_ksCache.has(key)) return _ksCache.get(key);
    const sr = ac.sampleRate;
    const N = Math.max(2, Math.round(sr / freq));
    const dur = clamp(6 / Math.sqrt(freq / 110), 1.2, 3.2);
    const len = Math.ceil(sr * dur);
    const buf = ac.createBuffer(1, len, sr);
    const out = buf.getChannelData(0);
    const ring = new Float32Array(N);
    let prev = 0;
    for (let i = 0; i < N; i++) {
      const w = Math.random() * 2 - 1;
      prev = bright * w + (1 - bright) * prev;   /* měkčí drnknutí */
      ring[i] = prev;
    }
    /* Útlum závislý na výšce → vyrovnaná délka dozvuku přes rejstřík. */
    const damp = Math.exp(-freq / (sr * 14));
    let idx = 0;
    for (let i = 0; i < len; i++) {
      const cur = ring[idx];
      const nxt = ring[(idx + 1) % N];
      out[i] = cur;
      ring[idx] = damp * 0.5 * (cur + nxt);
      idx = (idx + 1) % N;
    }
    /* Krátký fade okrajů proti DC lupnutí. */
    const f = Math.min(64, len >> 2);
    for (let i = 0; i < f; i++) { out[i] *= i / f; out[len - 1 - i] *= i / f; }
    _ksCache.set(key, buf);
    return buf;
  }

  function luteN(ac, dest, t, freq, dur, vel) {
    const src = ac.createBufferSource();
    src.buffer = ksBuffer(ac, freq, 0.62);
    const g = ac.createGain();
    g.gain.setValueAtTime(vel, t);
    g.connect(dest);
    src.connect(g);
    src.start(t);
    src.stop(t + src.buffer.duration);
  }
  /* Jasnější, kratší drnk pro rytmické štrejchy. */
  function luteMuteN(ac, dest, t, freq, dur, vel) {
    const src = ac.createBufferSource();
    src.buffer = ksBuffer(ac, freq, 0.85);
    const g = ac.createGain();
    g.gain.setValueAtTime(vel, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.5, dur + 0.2));
    g.connect(dest);
    src.connect(g);
    src.start(t);
    src.stop(t + Math.min(0.6, dur + 0.3));
  }

  /* ------------------------------------------------------------- flétna -- */
  function fluteN(ac, dest, t, freq, dur, vel) {
    const g = ac.createGain();
    const a = Math.min(0.09, dur * 0.35);
    const r = Math.min(0.28, dur * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + a);
    g.gain.setValueAtTime(vel, Math.max(t + a, t + dur - r));
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.06);
    g.connect(dest);

    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * rnd(0.998, 1.002), t);
    o.connect(g);
    const o2 = ac.createOscillator();               /* dech oktávy – barva */
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq * 2.001, t);
    const g2 = ac.createGain();
    g2.gain.value = 0.10;
    o2.connect(g2); g2.connect(g);

    /* zpožděné vibrato */
    const lfo = ac.createOscillator();
    lfo.frequency.setValueAtTime(rnd(4.4, 5.2), t);
    const lg = ac.createGain();
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(freq * 0.008, t + Math.min(0.4, dur * 0.6));
    lfo.connect(lg); lg.connect(o.frequency);

    /* dechový šum */
    const n = ac.createBufferSource();
    n.buffer = noiseBuf(ac); n.loop = true;
    n.playbackRate.value = rnd(0.9, 1.1);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq * 2; bp.Q.value = 9;
    const ng = ac.createGain();
    ng.gain.value = vel * 0.16;
    n.connect(bp); bp.connect(ng); ng.connect(g);

    const end = t + dur + 0.12;
    o.start(t); o2.start(t); lfo.start(t); n.start(t, rnd(0, 1));
    o.stop(end); o2.stop(end); lfo.stop(end); n.stop(end);
  }

  /* -------------------------------------------------------------- viola -- */
  function violaN(ac, dest, t, freq, dur, vel) {
    const g = ac.createGain();
    const a = Math.min(0.14, dur * 0.4);
    const r = Math.min(0.3, dur * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + a);
    g.gain.setValueAtTime(vel, Math.max(t + a, t + dur - r));
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.08);
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 2.2, t);
    lp.frequency.linearRampToValueAtTime(freq * 3.4, t + a * 2);   /* smyčec se opře */
    lp.Q.value = 1.1;
    lp.connect(g); g.connect(dest);
    const s1 = ac.createOscillator();
    s1.type = 'sawtooth'; s1.frequency.setValueAtTime(freq, t); s1.detune.value = -5;
    const s2 = ac.createOscillator();
    s2.type = 'sawtooth'; s2.frequency.setValueAtTime(freq, t); s2.detune.value = 5;
    const mix = ac.createGain(); mix.gain.value = 0.5;
    s1.connect(mix); s2.connect(mix); mix.connect(lp);
    const end = t + dur + 0.15;
    s1.start(t); s2.start(t); s1.stop(end); s2.stop(end);
  }

  /* --------------------------------------------------------------- zvon -- */
  function bellN(ac, dest, t, freq, dur, vel) {
    const decay = clamp(dur * 1.4, 0.8, 6);
    const c = ac.createOscillator();
    c.type = 'sine'; c.frequency.setValueAtTime(freq, t);
    const m = ac.createOscillator();
    m.type = 'sine'; m.frequency.setValueAtTime(freq * 2.76, t);   /* inharmonické */
    const mg = ac.createGain();
    mg.gain.setValueAtTime(freq * 2.4, t);
    mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + decay * 0.65);
    m.connect(mg); mg.connect(c.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    c.connect(g); g.connect(dest);
    /* spodní hum parciála */
    const h = ac.createOscillator();
    h.type = 'sine'; h.frequency.setValueAtTime(freq * 0.5, t);
    const hg = ac.createGain();
    hg.gain.setValueAtTime(0.0001, t);
    hg.gain.linearRampToValueAtTime(vel * 0.35, t + 0.015);
    hg.gain.exponentialRampToValueAtTime(0.0001, t + decay * 1.25);
    h.connect(hg); hg.connect(dest);
    const end = t + decay * 1.3 + 0.1;
    c.start(t); m.start(t); h.start(t);
    c.stop(end); m.stop(end); h.stop(end);
  }
  /* Zvonkohra — kratší, tišší doznění pro melodické linky v observatoři. */
  function chimeN(ac, dest, t, freq, dur, vel) {
    bellN(ac, dest, t, freq, Math.min(dur, 1.1), vel * 0.8);
  }

  /* ----------------------------------------------- skřipky (Benda) ------ */
  function fiddleN(ac, dest, t, freq, dur, vel) {
    const g = ac.createGain();
    const a = Math.min(0.05, dur * 0.3);
    const r = Math.min(0.14, dur * 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + a);
    g.gain.setValueAtTime(vel, Math.max(t + a, t + dur - r));
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.05);
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.7;
    const bp = ac.createBiquadFilter();                     /* formant korpusu */
    bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 0.9;
    const bg = ac.createGain(); bg.gain.value = 0.9;
    const s = ac.createOscillator();
    s.type = 'sawtooth'; s.frequency.setValueAtTime(freq * rnd(0.997, 1.003), t);
    const lfo = ac.createOscillator();
    lfo.frequency.setValueAtTime(rnd(5.6, 6.4), t);
    const lg = ac.createGain();
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(freq * 0.013, t + Math.min(0.18, dur * 0.5));
    lfo.connect(lg); lg.connect(s.frequency);
    s.connect(bp); bp.connect(bg); bg.connect(lp); lp.connect(g); g.connect(dest);
    /* škrábnutí smyčce na začátku tahu */
    const n = ac.createBufferSource();
    n.buffer = noiseBuf(ac); n.loop = true;
    const nf = ac.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 2400; nf.Q.value = 2;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(vel * 0.25, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    n.connect(nf); nf.connect(ng); ng.connect(dest);
    const end = t + dur + 0.1;
    s.start(t); lfo.start(t); n.start(t, rnd(0, 1));
    s.stop(end); lfo.stop(end); n.stop(t + 0.09);
  }

  const INSTR = {
    lute: luteN, luteMute: luteMuteN, flute: fluteN,
    viola: violaN, bell: bellN, chime: chimeN, fiddle: fiddleN
  };

  /* ------------------------------------------- kontinuální vrstvy (pady) -- */

  /* Tichý sníh — dýchající filtrovaný šum. Vrací stop(). */
  function snowPad(ac, dest, baseHz, vol) {
    const n = ac.createBufferSource();
    n.buffer = noiseBuf(ac); n.loop = true;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = baseHz; lp.Q.value = 0.6;
    const g = ac.createGain();
    const t0 = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 3.5);
    const lfo = ac.createOscillator();
    lfo.frequency.value = rnd(0.04, 0.08);
    const lg = ac.createGain(); lg.gain.value = baseHz * 0.45;
    lfo.connect(lg); lg.connect(lp.frequency);
    /* druhé, pomalejší dýchání hlasitosti */
    const lfo2 = ac.createOscillator();
    lfo2.frequency.value = rnd(0.02, 0.05);
    const lg2 = ac.createGain(); lg2.gain.value = vol * 0.35;
    lfo2.connect(lg2); lg2.connect(g.gain);
    n.connect(lp); lp.connect(g); g.connect(dest);
    n.start(t0, rnd(0, 1)); lfo.start(t0); lfo2.start(t0);
    return () => {
      const e = ac.currentTime + 2.3;
      try { n.stop(e); lfo.stop(e); lfo2.stop(e); } catch (err) { /* ignore */ }
    };
  }

  /* Violový drone (kvinta) — dvě rozladěné pily, pomalé vlnění. */
  function droneViola(ac, dest, midiRoot, vol) {
    const t0 = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 4);
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = midiHz(midiRoot) * 3; lp.Q.value = 0.8;
    lp.connect(g); g.connect(dest);
    const oscs = [];
    [[midiRoot, -6], [midiRoot, 6], [midiRoot + 7, -4]].forEach((sp) => {
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = midiHz(sp[0]);
      o.detune.value = sp[1];
      const og = ac.createGain(); og.gain.value = 0.4;
      o.connect(og); og.connect(lp);
      o.start(t0); oscs.push(o);
    });
    const lfo = ac.createOscillator();
    lfo.frequency.value = rnd(0.06, 0.11);
    const lg = ac.createGain(); lg.gain.value = vol * 0.3;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start(t0); oscs.push(lfo);
    return () => {
      const e = ac.currentTime + 2.3;
      oscs.forEach((o) => { try { o.stop(e); } catch (err) { /* ignore */ } });
    };
  }

  /* ---------------------------------------------------------- sekvencer -- */
  /* parts: { i:'lute', seq:[[midi|null,doby],…], g, oct, legato, when }
   * Každá část má vlastní časovou osu — běží dál, i když when()==false,
   * takže se adaptivní vrstva připojí přesně v tempu.                     */
  function runSequencer(ac, dest, parts, tempo) {
    const spb = 60 / tempo;
    const ps = parts.map((p) => ({
      def: p, idx: 0, t: ac.currentTime + 0.08 + (p.delay || 0) * spb
    }));
    let alive = true;
    const tick = () => {
      if (!alive) return;
      const horizon = ac.currentTime + 0.65;
      for (const p of ps) {
        const d = p.def;
        let guard = 0;
        while (p.t < horizon && guard++ < 96) {
          const step = d.seq[p.idx];
          const m = step[0], beats = step[1];
          if (m !== null && (!d.when || d.when())) {
            const jt = rnd(-0.007, 0.007);
            const vel = (d.g || 0.5) * rnd(0.86, 1.12);
            INSTR[d.i](ac, dest, Math.max(p.t + jt, ac.currentTime),
              midiHz(m + (d.oct || 0)), beats * spb * (d.legato || 0.92), vel);
          }
          p.t += beats * spb;
          p.idx = (p.idx + 1) % d.seq.length;
        }
      }
    };
    tick();
    const iv = setInterval(tick, 140);
    return () => { alive = false; clearInterval(iv); };
  }

  /* Registrace tracku: parts + volitelné kontinuální vrstvy. */
  function defTrack(id, tempo, partsFn, contFns) {
    audio.registerTrack(id, (ac, out) => {
      const lim = limiter(ac, out);
      const stops = [];
      if (contFns) for (const f of contFns) stops.push(f(ac, lim));
      stops.push(runSequencer(ac, lim, partsFn(), tempo));
      return {
        stop() {
          for (const s of stops) { try { s(); } catch (e) { /* ignore */ } }
        }
      };
    });
  }

  /* ================================ SFX ================================= */
  /* Engine předává čerstvý gain uzel; nastavíme mu celkovou hlasitost
   * a stavíme do limiteru, aby ani vrstvené SFX nepřebudily mix.          */
  function defSfx(id, vol, build) {
    audio.registerSfx(id, (ac, out) => {
      out.gain.value = vol;
      build(ac, limiter(ac, out), ac.currentTime + 0.01);
    });
  }

  /* šumový burst přes filtr — základ mnoha ruchů */
  function burst(ac, dest, t, dur, type, f0, f1, q, vel) {
    const n = ac.createBufferSource();
    n.buffer = noiseBuf(ac); n.loop = true;
    const fl = ac.createBiquadFilter();
    fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + Math.min(0.012, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(fl); fl.connect(g); g.connect(dest);
    n.start(t, rnd(0, 1.5)); n.stop(t + dur + 0.05);
  }

  /* sinusový chirp (kapky, žbluňk, štěknutí…) */
  function chirp(ac, dest, t, dur, f0, f1, vel, type) {
    const o = ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(25, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + Math.min(0.01, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.03);
  }

  /* --- sfx_splash — žbluňknutí u jezu ----------------------------------- */
  defSfx('sfx_splash', 0.7, (ac, lim, t) => {
    chirp(ac, lim, t, 0.09, 480, 140, 0.55);                       /* žbluňk */
    burst(ac, lim, t + 0.02, 0.5, 'lowpass', 1500, 320, 0.8, 0.5); /* hlavní šplouch */
    burst(ac, lim, t + 0.12, 0.7, 'bandpass', 2600, 900, 1.4, 0.2);/* spršky */
    for (let i = 0; i < 5; i++) {                                   /* kapky */
      const dt = 0.2 + i * rnd(0.05, 0.1);
      chirp(ac, lim, t + dt, 0.05, rnd(900, 1700), rnd(300, 500), 0.12);
    }
  });

  /* --- sfx_ice_crack — prasknutí ledu ----------------------------------- */
  defSfx('sfx_ice_crack', 0.75, (ac, lim, t) => {
    burst(ac, lim, t, 0.05, 'highpass', 2400, 2400, 0.7, 0.8);     /* křupnutí */
    chirp(ac, lim, t + 0.01, 0.5, 420, 48, 0.5);                   /* táhlé puknutí */
    for (let i = 0; i < 4; i++) {                                   /* trhlinky běží */
      const dt = 0.08 + i * rnd(0.05, 0.09);
      burst(ac, lim, t + dt, 0.04, 'bandpass', rnd(1400, 3200), 900, 3, 0.3);
    }
    burst(ac, lim, t + 0.05, 0.6, 'lowpass', 260, 70, 0.8, 0.35);  /* dunění pod ledem */
  });

  /* --- sfx_goose — Markyta syčí a kejhá --------------------------------- */
  defSfx('sfx_goose', 0.55, (ac, lim, t) => {
    burst(ac, lim, t, 0.28, 'bandpass', 3400, 2600, 1.2, 0.3);     /* sssss */
    for (let i = 0; i < 2; i++) {                                   /* gag-gag */
      const t0 = t + 0.3 + i * 0.22;
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(300 + i * 40, t0);
      o.frequency.exponentialRampToValueAtTime(210, t0 + 0.16);
      const am = ac.createOscillator(); am.frequency.value = 26;    /* chraplavé AM */
      const amg = ac.createGain(); amg.gain.value = 0.5;
      const base = ac.createGain(); base.gain.value = 0.5;
      am.connect(amg);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.6;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.5, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(base); base.connect(bp); amg.connect(base.gain);
      bp.connect(g); g.connect(lim);
      o.start(t0); am.start(t0); o.stop(t0 + 0.2); am.stop(t0 + 0.2);
    }
  });

  /* --- sfx_bell — zvon z věže (i ohlášení Keplera) ---------------------- */
  defSfx('sfx_bell', 0.6, (ac, lim, t) => {
    bellN(ac, lim, t, midiHz(57), 4.5, 0.55);
    bellN(ac, lim, t + 1.6, midiHz(57) * rnd(0.996, 1.004), 4.5, 0.45);
  });

  /* --- sfx_crow — vrány na hřebeni -------------------------------------- */
  defSfx('sfx_crow', 0.5, (ac, lim, t) => {
    for (let i = 0; i < 2; i++) {
      const t0 = t + i * rnd(0.28, 0.36);
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(rnd(620, 700), t0);
      o.frequency.exponentialRampToValueAtTime(430, t0 + 0.18);
      const am = ac.createOscillator(); am.frequency.value = 42;
      const amg = ac.createGain(); amg.gain.value = 0.55;
      const base = ac.createGain(); base.gain.value = 0.45;
      am.connect(amg); amg.connect(base.gain);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.5, t0 + 0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(base); base.connect(bp); bp.connect(g); g.connect(lim);
      o.start(t0); am.start(t0); o.stop(t0 + 0.22); am.stop(t0 + 0.22);
    }
  });

  /* --- sfx_dog — Ryšák: haf + funění ------------------------------------ */
  defSfx('sfx_dog', 0.6, (ac, lim, t) => {
    chirp(ac, lim, t, 0.12, 620, 130, 0.5, 'square');              /* haf */
    burst(ac, lim, t, 0.1, 'lowpass', 900, 300, 0.8, 0.4);
    burst(ac, lim, t + 0.35, 0.18, 'lowpass', 500, 250, 0.8, 0.18);/* funí */
    burst(ac, lim, t + 0.6, 0.18, 'lowpass', 500, 250, 0.8, 0.14);
  });

  /* --- sfx_grind — hmoždíř tře duběnky ---------------------------------- */
  defSfx('sfx_grind', 0.55, (ac, lim, t) => {
    for (let i = 0; i < 3; i++) {                                   /* tři krouživé tahy */
      const t0 = t + i * 0.42;
      const n = ac.createBufferSource();
      n.buffer = noiseBuf(ac); n.loop = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 2.2;
      bp.frequency.setValueAtTime(500, t0);
      bp.frequency.linearRampToValueAtTime(1100, t0 + 0.18);        /* krouží */
      bp.frequency.linearRampToValueAtTime(600, t0 + 0.36);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.4, t0 + 0.06);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 0.38);
      n.connect(bp); bp.connect(g); g.connect(lim);
      n.start(t0, rnd(0, 1)); n.stop(t0 + 0.4);
      chirp(ac, lim, t0 + rnd(0.05, 0.2), 0.03, rnd(1800, 2600), 1200, 0.08); /* kamínek */
    }
  });

  /* --- sfx_quill — brk škrábe po pergamenu ------------------------------ */
  defSfx('sfx_quill', 0.45, (ac, lim, t) => {
    let t0 = t;
    for (let i = 0; i < 5; i++) {                                   /* tahy písma */
      const d = rnd(0.1, 0.24);
      burst(ac, lim, t0, d, 'highpass', rnd(3200, 4800), 3800, 1.5, rnd(0.18, 0.3));
      t0 += d + rnd(0.04, 0.14);
    }
    burst(ac, lim, t0, 0.06, 'highpass', 4200, 4200, 1.5, 0.28);    /* tečka */
  });

  /* --- sfx_seal — pečetidlo do vosku ------------------------------------ */
  defSfx('sfx_seal', 0.7, (ac, lim, t) => {
    chirp(ac, lim, t, 0.16, 130, 45, 0.6);                          /* žuchnutí */
    burst(ac, lim, t, 0.1, 'lowpass', 420, 120, 0.8, 0.45);
    burst(ac, lim, t + 0.24, 0.12, 'lowpass', 300, 90, 0.8, 0.16);  /* dosednutí */
  });

  /* --- sfx_snow_step — křupnutí sněhu (střídá dvě nohy) ----------------- */
  let _stepFlip = false;
  defSfx('sfx_snow_step', 0.35, (ac, lim, t) => {
    _stepFlip = !_stepFlip;
    const f = _stepFlip ? 1 : 0.85;
    burst(ac, lim, t, 0.09, 'lowpass', 1300 * f, 380 * f, 0.9, 0.4);
    burst(ac, lim, t + 0.015, 0.06, 'bandpass', 2400 * f, 1500, 1.8, 0.14); /* křupnutí krystalků */
  });

  /* --- sfx_door — vrznutí a dosednutí dveří ----------------------------- */
  defSfx('sfx_door', 0.55, (ac, lim, t) => {
    const o = ac.createOscillator();                                /* vrz pantů */
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(160, t);
    o.frequency.linearRampToValueAtTime(230, t + 0.22);
    o.frequency.linearRampToValueAtTime(140, t + 0.4);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 3.5;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.42);
    o.connect(bp); bp.connect(g); g.connect(lim);
    o.start(t); o.stop(t + 0.45);
    chirp(ac, lim, t + 0.5, 0.1, 110, 50, 0.4);                     /* klapnutí */
    burst(ac, lim, t + 0.5, 0.08, 'lowpass', 600, 180, 0.8, 0.3);
  });

  /* --- sfx_pickup — sebrání předmětu (loutnové drnknutí vzhůru) --------- */
  defSfx('sfx_pickup', 0.5, (ac, lim, t) => {
    luteN(ac, lim, t, midiHz(74), 0.3, 0.4);
    luteN(ac, lim, t + 0.07, midiHz(79), 0.3, 0.4);
    luteN(ac, lim, t + 0.14, midiHz(86), 0.4, 0.35);
  });

  /* --- sfx_sleigh — rolničky Keplerových saní --------------------------- */
  defSfx('sfx_sleigh', 0.5, (ac, lim, t) => {
    const dur = 2.4, rate = 7;                                      /* klus koní */
    const total = Math.floor(dur * rate);
    for (let i = 0; i < total; i++) {
      const t0 = t + i / rate + rnd(-0.02, 0.02);
      const env = 0.5 + 0.5 * Math.sin((i / total) * Math.PI);      /* přijíždí a míjí */
      for (let j = 0; j < 2; j++) {                                  /* svazek rolniček */
        const f = rnd(2300, 4300);
        const o = ac.createOscillator();
        o.type = 'sine'; o.frequency.setValueAtTime(f, t0);
        const m = ac.createOscillator();
        m.type = 'sine'; m.frequency.setValueAtTime(f * 2.76, t0);
        const mg = ac.createGain(); mg.gain.setValueAtTime(f * 0.9, t0);
        m.connect(mg); mg.connect(o.frequency);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.12 * env * rnd(0.6, 1), t0 + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + rnd(0.1, 0.2));
        o.connect(g); g.connect(lim);
        o.start(t0); m.start(t0);
        o.stop(t0 + 0.22); m.stop(t0 + 0.22);
      }
    }
  });
})();

<script>
/* =========================================================================
   ZTRACENÝ LIST v2 — 65_ambience.js
   Okolní ruchy scén (čistá WebAudio syntéza, žádné soubory) + UI zvuky.

   Každá ambience = smyčka kontinuálních vrstev (vítr s nárazy, proud řeky,
   praskání ohně, šum trhu) a náhodně plánovaných „událostí" (vrány, psí
   štěk, sova, praskání ledu, tikot hodin, vzdálený zvon). Engine je
   crossfaduje při změně scény (audio.playAmbience) a pouští přes vlastní
   sběrnici s dozvukem, jehož vlhkost určuje audio.sceneReverb.
   ========================================================================= */
(function () {
'use strict';
const BNJ = window.BNJ;
const audio = BNJ && BNJ.audio;
if (!audio || !audio.registerAmbience) return;

const rnd = (a, b) => a + Math.random() * (b - a);
let _nz = null, _nzAc = null, _brown = null;
function noise(ac) {
  if (_nz && _nzAc === ac) return _nz;
  const len = ac.sampleRate * 3;
  _nz = ac.createBuffer(1, len, ac.sampleRate);
  const d = _nz.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  _brown = ac.createBuffer(1, len, ac.sampleRate);
  const b = _brown.getChannelData(0);
  let l = 0;
  for (let i = 0; i < len; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = l * 3.5; }
  _nzAc = ac;
  return _nz;
}
function brown(ac) { noise(ac); return _brown; }

function src(ac, buf) {
  const s = ac.createBufferSource();
  s.buffer = buf; s.loop = true;
  s.loopStart = Math.random() * 1.5;
  s.start(ac.currentTime, Math.random() * 2);
  return s;
}

/* vítr: šum → bandpass, jehož frekvence i hlasitost dýchá (nárazy) */
function wind(ac, out, base, vol, gusty) {
  const s = src(ac, noise(ac));
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = base; bp.Q.value = 0.8;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = base * 3;
  const g = ac.createGain(); g.gain.value = vol;
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  s.connect(bp); bp.connect(lp); lp.connect(g);
  if (pan) { g.connect(pan); pan.connect(out); } else g.connect(out);
  let alive = true;
  const step = () => {
    if (!alive) return;
    const t = ac.currentTime, d = rnd(2.5, 6);
    const gust = gusty && Math.random() < 0.3;
    try {
      bp.frequency.linearRampToValueAtTime(base * (gust ? rnd(1.6, 2.4) : rnd(0.7, 1.3)), t + d);
      g.gain.linearRampToValueAtTime(vol * (gust ? rnd(1.6, 2.4) : rnd(0.5, 1.1)), t + d);
      if (pan) pan.pan.linearRampToValueAtTime(rnd(-0.6, 0.6), t + d);
    } catch (e) { /* ignore */ }
    setTimeout(step, d * 1000);
  };
  step();
  return () => { alive = false; try { s.stop(); } catch (e) { /* ignore */ } };
}

/* proud vody: hnědý šum přes lowpass + jemné bublání */
function river(ac, out, vol, cut) {
  const s = src(ac, brown(ac));
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut || 900;
  const g = ac.createGain(); g.gain.value = vol;
  s.connect(lp); lp.connect(g); g.connect(out);
  const s2 = src(ac, noise(ac));
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 3;
  const g2 = ac.createGain(); g2.gain.value = vol * 0.12;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.31;
  const lg = ac.createGain(); lg.gain.value = 500;
  lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
  s2.connect(bp); bp.connect(g2); g2.connect(out);
  return () => { try { s.stop(); s2.stop(); lfo.stop(); } catch (e) { /* ignore */ } };
}

/* oheň: hluboké hučení + náhodné praskání */
function fire(ac, out, vol) {
  const s = src(ac, brown(ac));
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
  const g = ac.createGain(); g.gain.value = vol * 0.8;
  s.connect(lp); lp.connect(g); g.connect(out);
  let alive = true;
  const crack = () => {
    if (!alive) return;
    const t = ac.currentTime;
    const n = Math.random() < 0.25 ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const b = ac.createBufferSource(); b.buffer = noise(ac);
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = rnd(1500, 4000);
      const eg = ac.createGain();
      const tt = t + i * rnd(0.02, 0.07);
      eg.gain.setValueAtTime(0, tt); eg.gain.linearRampToValueAtTime(vol * rnd(0.6, 1.6), tt + 0.002);
      eg.gain.exponentialRampToValueAtTime(0.0001, tt + rnd(0.02, 0.06));
      b.connect(hp); hp.connect(eg); eg.connect(out);
      b.start(tt, Math.random() * 2); b.stop(tt + 0.1);
    }
    setTimeout(crack, rnd(60, 420));
  };
  crack();
  return () => { alive = false; try { s.stop(); } catch (e) { /* ignore */ } };
}

/* šum davu: několik formantově filtrovaných šumů s pomalou modulací */
function crowd(ac, out, vol) {
  const stops = [];
  [[420, 6], [780, 7], [1250, 8], [2400, 9]].forEach(([f, q], i) => {
    const s = src(ac, noise(ac));
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const g = ac.createGain(); g.gain.value = vol * (i === 0 ? 1 : 0.6);
    const lfo = ac.createOscillator(); lfo.frequency.value = rnd(2, 5);
    const lg = ac.createGain(); lg.gain.value = vol * 0.5;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    s.connect(bp); bp.connect(g); g.connect(out);
    stops.push(() => { s.stop(); lfo.stop(); });
  });
  return () => stops.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
}

/* plánovač náhodných událostí */
function events(list) {
  let alive = true;
  const tids = [];
  for (const ev of list) {
    const go = () => {
      if (!alive) return;
      try { ev.fn(); } catch (e) { /* ignore */ }
      tids.push(setTimeout(go, rnd(ev.min, ev.max) * 1000));
    };
    tids.push(setTimeout(go, rnd(ev.first != null ? ev.first : ev.min * 0.4, ev.min) * 1000));
  }
  return () => { alive = false; tids.forEach(clearTimeout); };
}
const sfx = (id, pan, vol) => BNJ.sfx(id, { pan: pan != null ? pan : rnd(-0.8, 0.8), vol: vol != null ? vol : rnd(0.25, 0.5) });

/* drobné syntetické hlasy prostředí */
function tone(ac, out, t, f0, f1, dur, vol, type) {
  const o = ac.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.03, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
}
function sparrows(ac, out, vol) {
  const t = ac.currentTime, n = 2 + (Math.random() * 4 | 0);
  const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
  const dst = p || out; if (p) { p.pan.value = rnd(-0.8, 0.8); p.connect(out); }
  for (let i = 0; i < n; i++) { const f = rnd(3600, 5200); tone(ac, dst, t + i * rnd(0.08, 0.16), f, f * rnd(0.7, 1.2), 0.06, vol); }
}
function owl(ac, out, vol) {
  const t = ac.currentTime;
  const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
  const dst = p || out; if (p) { p.pan.value = rnd(-0.9, 0.9); p.connect(out); }
  tone(ac, dst, t, 420, 380, 0.35, vol);
  tone(ac, dst, t + 0.6, 440, 360, 0.25, vol * 0.7);
  tone(ac, dst, t + 0.95, 450, 370, 0.7, vol);
}
function tick(ac, out, vol) {
  const t = ac.currentTime;
  for (let i = 0; i < 8; i++) {
    const b = ac.createBufferSource(); b.buffer = noise(ac);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = i % 2 ? 2600 : 3200; bp.Q.value = 12;
    const g = ac.createGain(); const tt = t + i * 0.5;
    g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(vol, tt + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.03);
    b.connect(bp); bp.connect(g); g.connect(out); b.start(tt, Math.random()); b.stop(tt + 0.05);
  }
}
function iceGroan(ac, out, vol) {
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(rnd(90, 160), t); o.frequency.exponentialRampToValueAtTime(rnd(40, 70), t + 1.2);
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 6;
  bp.frequency.exponentialRampToValueAtTime(220, t + 1.2);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  o.connect(bp); bp.connect(g); g.connect(out); o.start(t); o.stop(t + 1.4);
}
function whisper(ac, out, vol) {
  // bludičky: dýchavé formantové „šepoty"
  const t = ac.currentTime, d = rnd(1.2, 2.2);
  const b = ac.createBufferSource(); b.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
  bp.frequency.setValueAtTime(rnd(700, 1400), t); bp.frequency.linearRampToValueAtTime(rnd(1400, 2600), t + d);
  const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + d * 0.4); g.gain.linearRampToValueAtTime(0.0001, t + d);
  b.connect(bp); bp.connect(g);
  if (p) { p.pan.setValueAtTime(rnd(-1, 0), t); p.pan.linearRampToValueAtTime(rnd(0, 1), t + d); g.connect(p); p.connect(out); } else g.connect(out);
  b.start(t, Math.random() * 2); b.stop(t + d + 0.1);
}

function amb(id, layers) {
  audio.registerAmbience(id, (ac, out) => {
    const stops = layers.map(f => f(ac, out)).filter(Boolean);
    return { stop() { stops.forEach(s => { try { s(); } catch (e) { /* ignore */ } }); } };
  });
}

<script>
/* =========================================================================
   ZTRACENÝ LIST v2 — 70_hints.js
   Kontextová nápověda „Co dál?" (klávesa H / tlačítko se sovou).
   BNJ.hints.get(state) → { goal:{cz,en}, steps:[{cz,en}, …] }
   goal = co je teď cílem (vždy zobrazeno), steps = postupně odkrývané
   rady od vágní po přesnou. Logika kopíruje dependency graf
   z design/WALKTHROUGH.md — mění se jen čtením flagů a inventáře.
   ========================================================================= */
(function () {
'use strict';
const BNJ = window.BNJ;
if (!BNJ) return;

const C = (cz, en) => ({ cz, en });

function get(s) {
  const F = (n) => !!(s.flags && s.flags[n]);
  const has = (n) => (s.inventory || []).indexOf(n) >= 0;
  const gotA = has('frag_a') || F('_frag_a_in') || F('letter_read');
  const gotB = has('frag_b') || F('_frag_b_in') || F('letter_read');
  const gotC = has('frag_c') || F('_frag_c_in') || F('letter_read');

  if (F('finale_started')) {
    const n = (s.facts || []).length;
    const total = Object.keys((BNJ.strings && BNJ.strings.facts) || {}).length || 13;
    return {
      goal: C('List je doručen. Benátky si tě zapamatují!', 'The letter is delivered. Benátky will remember you!'),
      steps: [
        C('Kronika má ' + n + ' z ' + total + ' pravdivých faktů. Zkus prozkoumat okem vše, co jsi přehlédl.',
          'The Chronicle holds ' + n + ' of ' + total + ' true facts. Try looking at everything you skipped.'),
        C('Fakta se skrývají v rozhovorech a v pohledu na zvonici, tkalcovnu, sextant a Marsovy poznámky.',
          'Facts hide in conversations and in looking at the belfry, the weaver’s house, the sextant and the Mars notes.')
      ]
    };
  }
  if (!F('knows_quest')) {
    return {
      goal: C('Přiznej se Tychonovi Brahemu, co se stalo s císařským listem.',
              'Confess to Tycho Brahe what happened to the imperial letter.'),
      steps: [
        C('Brahe sídlí ve věži benáteckého zámku — z náměstí vede cesta vzhůru.',
          'Brahe lives in the tower of Benátky castle — a road leads up from the square.'),
        C('Uličkou vlevo na náměstí, cestou k zámku, dveřmi věže do observatoře. Tam s Brahem promluv.',
          'Take the lane left to the square, the road up to the castle, the tower door to the observatory — and talk to Brahe.')
      ]
    };
  }
  if (!(gotA && gotB && gotC)) {
    const steps = [];
    const goal = C('Vylov všechny tři kusy listu (' + [gotA, gotB, gotC].filter(Boolean).length + ' / 3).',
                   'Fish out all three pieces of the letter (' + [gotA, gotB, gotC].filter(Boolean).length + ' / 3).');
    if (!gotA && !has('podberak')) {
      if (!F('gossip_told') && !has('cednik')) {
        steps.push(C('Kus listu se točí ve víru pod jezem. Holou rukou ho nevylovíš — chce to něco jako síto na tyči.',
                     'A piece swirls in the eddy under the weir. Bare hands won’t do — you need something like a sieve on a pole.'));
        steps.push(C('Trhovkyně Bětka na náměstí má cedník. Peníze nechce — platí se drby ze zámku. Promluv s ní.',
                     'Betka the market woman on the square has a strainer. She takes gossip, not coins. Talk to her.'));
      } else if (!F('met_prevoznik') && !has('bidlo')) {
        steps.push(C('Cedník máš. Teď ještě něco dlouhého… převozník Vávra u řeky má bidlo.',
                     'You have the strainer. Now something long… Vávra the ferryman by the river has a pole.'));
        steps.push(C('Promluv s Vávrou o cestě na druhý břeh.', 'Ask Vávra about getting to the other bank.'));
      } else {
        steps.push(C('Cedník a bidlo… co kdyby byly jedna věc?', 'A strainer and a pole… what if they were one thing?'));
        steps.push(C('V inventáři klikni na cedník a pak na bidlo — vznikne „astronomický podběrák".',
                     'In the inventory click the strainer, then the pole — behold the “astronomical landing net”.'));
      }
    } else if (!gotA) {
      steps.push(C('Podběrák je hotový. Kde že se ten kus listu točil?', 'The net is ready. Where was that piece swirling again?'));
      steps.push(C('Vyber podběrák v inventáři a použij ho na jez s vírem u řeky.', 'Select the net and use it on the weir eddy by the river.'));
    }
    if (!gotB) {
      if (!F('goose_lured')) {
        steps.push(C('Husa Markyta sedí na hnízdě u řeky — a něco tam pod sebou hlídá. Potřebuješ ji vylákat.',
                     'Markyta the goose sits on her nest by the river, guarding something. You need to lure her away.'));
        steps.push(C(has('zrno') ? 'Dej huse zrní z inventáře.' : 'Zrní má Bětka na náměstí — vyměň ho za drby, pak ho dej huse.',
                     has('zrno') ? 'Give the goose the grain from your inventory.' : 'Betka on the square has grain — trade gossip for it, then give it to the goose.'));
      } else {
        steps.push(C('Markyta opustila hnízdo!', 'Markyta has left her nest!'));
        steps.push(C('Prohledej hnízdo rukou — najdeš kus listu i husí brk.', 'Search the nest with the hand — a letter piece and a goose quill.'));
      }
    }
    if (!gotC) {
      if (!F('met_prevoznik')) {
        steps.push(C('Třetí kus odnesl proud až do mokřadů v Obodři, za Starými Benátkami. Přes led tě ale nikdo nepustí…',
                     'The current took the third piece to the Obodř marsh, beyond Old Benátky. But nobody lets you onto the ice…'));
        steps.push(C('Promluv s převozníkem Vávrou — ukáže ti bezpečnou cestu po ledu.', 'Talk to Vávra the ferryman — he’ll show you a safe way across the ice.'));
      } else {
        steps.push(C('Třetí kus zamrzl v tůni v mokřadech Obodře. Led je tvrdý jako kámen — chce to teplo.',
                     'The third piece is frozen in a pool in the Obodř marsh. The ice is rock hard — it needs warmth.'));
        steps.push(C(has('svicka') ? 'Použij svíčku na zamrzlou tůň.' : 'Svíčku prodává (za drby) Bětka na náměstí. Pak ji použij na zamrzlou tůň.',
                     has('svicka') ? 'Use the candle on the frozen pool.' : 'Betka on the square trades a candle for gossip. Then use it on the frozen pool.'));
      }
    }
    return { goal, steps: interleave(steps) };
  }
  if (!F('letter_read')) {
    const placed = (F('_frag_a_in') ? 1 : 0) + (F('_frag_b_in') ? 1 : 0) + (F('_frag_c_in') ? 1 : 0);
    return {
      goal: C('Fragmenty jsou vybledlé. Musíš je přečíst.', 'The fragments are faded. You must read them.'),
      steps: [
        C('Brahe má v observatoři přístroj, který umí pracovat se světlem…', 'Brahe has an instrument in the observatory that plays with light…'),
        C('Polož všechny tři fragmenty na velký sextant (' + placed + ' / 3).', 'Put all three fragments on the great sextant (' + placed + ' / 3).'),
        C('Při zaměřování zvol: „Měsíc nízko nad obzorem, zrcátkem šikmo na pult."', 'When aiming, choose: “The moon low on the horizon, mirror slanted onto the desk.”')
      ]
    };
  }
  if (!F('prepis_done')) {
    const steps = [];
    let todo = 0;
    if (!F('formule_known')) {
      todo++;
      steps.push(C('Chybí úvodní formule listu. Šumař Matěj Benda ve Starých Benátkách ji prý umí zazpívat.',
                   'The opening formula is missing. Matěj Benda the fiddler in Old Benátky can supposedly sing it.'));
      steps.push(C('Poskládej verše: „Z Boží milosti My…" → „Rudolf Druhý…" → „volený císař římský…" → „uherský a český král!"',
                   'Order the verses: “By the grace of God, We…” → “Rudolf the Second…” → “elected Roman Emperor…” → “King of Hungary and Bohemia!”'));
    }
    if (!has('inkoust')) {
      todo++;
      if (!has('dubenky')) {
        steps.push(C('Na přepis potřebuješ inkoust. Duběnkový — a duběnky rostou na starém dubu v Obodři.',
                     'You need ink. Oak-gall ink — and galls grow on the old oak in the Obodř marsh.'));
        steps.push(C('Použij ruku na starý dub v mokřadech.', 'Use the hand on the old oak in the marsh.'));
      } else if (!has('skalice')) {
        steps.push(C('K duběnkám patří zelená skalice. Brahe ji má v laboratoři.', 'Galls need green vitriol. Brahe keeps some in his lab.'));
        steps.push(C('Použij ruku na polici s lahvičkami v observatoři.', 'Use the hand on the shelf of jars in the observatory.'));
      } else {
        steps.push(C('Duběnky a skalici je potřeba spolu rozetřít.', 'The galls and vitriol need grinding together.'));
        steps.push(C('Použij duběnky na hmoždíř v observatoři.', 'Use the galls on the mortar in the observatory.'));
      }
    }
    if (!F('brahe_test_passed')) {
      todo++;
      steps.push(C('Pergamen a pečetidlo ti půjčí jen Brahe — ale nejdřív tě vyzkouší.', 'Only Brahe can lend you parchment and the seal — after a test.'));
      steps.push(C('Promluv s Brahem. A ten nos? Pověst praví stříbro… exhumace ale řekla mosaz.',
                   'Talk to Brahe. And the nose? Legend says silver… the exhumation said brass.'));
    }
    if (!todo) {
      steps.push(C('Máš všechno: formuli, inkoust, brk i pergamen.', 'You have it all: formula, ink, quill and parchment.'));
      steps.push(C('Použij pergamen na psací pult v observatoři.', 'Use the parchment on the writing desk in the observatory.'));
    }
    return { goal: C('Připrav všechno k přepisu listu.', 'Prepare everything to rewrite the letter.'), steps: interleave(steps) };
  }
  if (!F('letter_sealed')) {
    return {
      goal: C('Přepis je hotový. Ještě ho zapečetit.', 'The copy is done. Now seal it.'),
      steps: [
        C('Pečetní vosk se musí nahřát…', 'Sealing wax needs heat…'),
        C('Použij přepis na svícen v observatoři.', 'Use the copy on the candlestick in the observatory.')
      ]
    };
  }
  return {
    goal: C('Předej zapečetěný list Tychonovi Brahemu.', 'Hand the sealed letter to Tycho Brahe.'),
    steps: [
      C('Brahe čeká v observatoři.', 'Brahe is waiting in the observatory.'),
      C('Použij zapečetěný list na Braha.', 'Use the sealed letter on Brahe.')
    ]
  };
}

/* rady z více paralelních úkolů: nejdřív všechny vágní, pak přesné */
function interleave(steps) {
  const vague = [], exact = [];
  steps.forEach((s, i) => (i % 2 ? exact : vague).push(s));
  return vague.concat(exact);
}

BNJ.hints = { get };
})();

<script>
/* =========================================================================
   ZTRACENÝ LIST — 90_boot.js
   Start hry: kontrola registrací dle kánonu IDS.md (jen hlášení do konzole,
   nikdy pád), fade-in, spuštění enginu. Engine degraduje elegantně.
   ========================================================================= */
(function () {
'use strict';

/* Kánon ID dle design/IDS.md — slouží POUZE ke kontrolnímu výpisu. */
const EXPECTED = {
  scenes: ['title', 'castle_yard', 'observatory', 'river_bank', 'square', 'old_town', 'marsh'],
  characters: ['jirka', 'brahe', 'kepler', 'benda', 'prevoznik', 'trhovkyne'],
  items: ['mokry_list', 'frag_a', 'frag_b', 'frag_c', 'cednik', 'bidlo', 'podberak',
    'zrno', 'svicka', 'dubenky', 'skalice', 'inkoust', 'brk', 'pergamen',
    'pecetidlo', 'prepis', 'zapeceteny_list'],
  dialogs: ['dlg_intro', 'brahe_intro', 'brahe_test', 'prevoznik_intro', 'trhovkyne_intro',
    'trhovkyne_trade', 'benda_intro', 'benda_song', 'kepler_arrival', 'epilog'],
  tracks: ['title_theme', 'castle_theme', 'observatory_theme', 'river_theme',
    'square_theme', 'oldtown_theme', 'marsh_theme', 'finale_theme'],
  sfx: ['sfx_splash', 'sfx_ice_crack', 'sfx_goose', 'sfx_bell', 'sfx_crow', 'sfx_dog',
    'sfx_grind', 'sfx_quill', 'sfx_seal', 'sfx_snow_step', 'sfx_door', 'sfx_pickup', 'sfx_sleigh']
};

function checkGroup(label, expected, present) {
  const have = expected.filter(id => present[id]);
  const missing = expected.filter(id => !present[id]);
  const extra = Object.keys(present).filter(id => !expected.includes(id));
  console.info('[BNJ] ' + label + ': ' + have.length + '/' + expected.length + ' registrováno');
  if (missing.length) console.warn('[BNJ]   chybí ' + label + ': ' + missing.join(', ') + ' — engine je nahradí nouzově');
  if (extra.length) console.warn('[BNJ]   mimo kánon IDS.md (' + label + '): ' + extra.join(', '));
  return missing.length;
}

function report(BNJ) {
  const R = BNJ._registry || {};
  console.info('%c[BNJ] Ztracený list — kontrola registrací modulů', 'font-weight:bold');
  if (Array.isArray(window.__bnjMissing) && window.__bnjMissing.length) {
    console.warn('[BNJ] Nenačtené soubory modulů: ' + window.__bnjMissing.join(', '));
  }
  let miss = 0;
  miss += checkGroup('scény', EXPECTED.scenes, R.scenes || {});
  miss += checkGroup('postavy', EXPECTED.characters, R.characters || {});
  miss += checkGroup('předměty', EXPECTED.items, R.items || {});
  miss += checkGroup('dialogy', EXPECTED.dialogs, R.dialogs || {});
  const au = BNJ.audio || {};
  miss += checkGroup('hudební tracky', EXPECTED.tracks, au.tracks || {});
  miss += checkGroup('SFX', EXPECTED.sfx, au.sfxFns || {});
  // hotspoty — jen počty na scénu
  const hs = R.hotspots || {};
  const hsScenes = Object.keys(hs);
  if (hsScenes.length) {
    console.info('[BNJ] hotspoty: ' + hsScenes.map(s => s + '×' + hs[s].length).join(', '));
  } else {
    console.warn('[BNJ] hotspoty: žádné (50_puzzles.js se nejspíš nenačetl)');
  }
  if (!BNJ.strings) {
    console.warn('[BNJ] BNJ.strings chybí (10_strings.js) — UI poběží s klíči místo textů');
  }
  if (miss === 0) console.info('[BNJ] Vše na svém místě. Jizera může téct.');
  else console.warn('[BNJ] Chybí ' + miss + ' registrací — hra poběží v degradovaném režimu.');
}

function fatal(msg) {
  console.error('[BNJ] ' + msg);
  const host = document.getElementById('game') || document.body;
  const div = document.createElement('div');
  div.style.cssText = 'color:#e8dcbe;font:24px Georgia,serif;text-align:center;padding:40vh 10vw 0;';
  div.textContent = 'Ztracený list se nepodařilo rozvinout: ' + msg;
  host.appendChild(div);
}

function boot() {
  const BNJ = window.BNJ;
  if (!BNJ || typeof BNJ.boot !== 'function') {
    fatal('jádro enginu (src/00_engine.js) se nenačetlo.');
    return;
  }
  // globální záchytná síť — chyby modulů logujeme, hru neshazujeme
  window.addEventListener('error', function (e) {
    console.error('[BNJ] Zachycená chyba: ' + (e.message || e.type), e.error || '');
  });
  window.addEventListener('unhandledrejection', function (e) {
    console.error('[BNJ] Nezachycený promise:', e.reason);
  });
  try { report(BNJ); } catch (e) { console.error('[BNJ] Kontrola registrací selhala', e); }
  try {
    BNJ.boot();   // engine startuje na titulní obrazovce s fade-in (fader 1 → 0)
    console.info('[BNJ] Hra běží. Benátky nad Jizerou, léta Páně 1600.');
  } catch (e) {
    fatal('start enginu selhal (' + (e && e.message) + ').');
    console.error(e);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();

</script>
</body>
</html>
