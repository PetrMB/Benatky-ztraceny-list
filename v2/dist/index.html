      ctx.fillStyle = '#8a5f1e';
      ctx.font = '24px ' + FONT;
      ctx.fillText('✦', cx0, yy);
      ctx.fillStyle = '#3a2c1a';
      ctx.font = '26px ' + FONT;
      lines.forEach((L, i) => ctx.fillText(L, cx0 + 40, yy + i * 34));
      yy += lines.length * 34 + 22;
    }
  }
  const contentH = Math.max(0, yy + G.jScroll - cy0 - chh + 20);
  G._jMax = Math.max(0, contentH);
  ctx.restore();
  // počet
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a2c1a';
  ctx.font = 'bold 28px ' + FONT;
  ctx.fillText(S('journal_count') + ': ' + known.length + ' / ' + total, W / 2, py + ph - 90);
  menuButton(ctx, S('menu_back'), W / 2, py + ph - 42, () => { G.overlay = null; });
  ctx.textAlign = 'left';
}

function renderOverlay(ctx) {
  if (G.overlay === 'menu') renderMenuOverlay(ctx);
  else if (G.overlay === 'save') renderSaveLoadOverlay(ctx, 'save');
  else if (G.overlay === 'load') renderSaveLoadOverlay(ctx, 'load');
  else if (G.overlay === 'journal') renderJournalOverlay(ctx);
  else if (G.overlay === 'hint') renderHintOverlay(ctx);
  else if (G.overlay === 'settings') renderSettingsOverlay(ctx);
}

/* ------------------------------------------------------------- titulka */
function initTitle() {
  if (G.title) return;
  const rng = mulberry(1599);
  const T = { chimneys: [], obsWin: { x: 843, y: 356, w: 34, h: 46 } };

  // hvězdy (třpyt dynamicky)
  T.stars = [];
  for (let i = 0; i < 240; i++) {
    T.stars.push({ x: rng() * W, y: rng() * 640, r: 0.5 + rng() * 1.5, ph: rng() * TAU, sp: 0.6 + rng() * 1.8 });
  }
  // sníh — 3 hloubky
  T.snow = [];
  const counts = [72, 52, 34], sizes = [1.4, 2.4, 3.8], spds = [26, 46, 78];
  for (let d = 0; d < 3; d++) {
    for (let i = 0; i < counts[d]; i++) {
      T.snow.push({ x0: rng() * W, y0: rng() * H, r: sizes[d] * (0.7 + rng() * 0.6), sp: spds[d] * (0.8 + rng() * 0.4), sw: 24 + rng() * 40, ph: rng() * TAU, a: 0.35 + d * 0.22 });
    }
  }

  // ---- statické vrstvy ----
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

  // nebe + mléčná dráha + statické hvězdičky
  T.sky = mk();
  {
    const x = T.sky.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1d3a');
    g.addColorStop(0.55, '#132a4c');
    g.addColorStop(1, '#1c3a5e');
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    // pás mléčné dráhy
    x.save();
    x.translate(W / 2, 340);
    x.rotate(-0.42);
    const mg = x.createLinearGradient(0, -130, 0, 130);
    mg.addColorStop(0, 'rgba(200,215,240,0)');
    mg.addColorStop(0.5, 'rgba(210,222,245,0.10)');
    mg.addColorStop(1, 'rgba(200,215,240,0)');
    x.fillStyle = mg;
    x.fillRect(-1400, -130, 2800, 260);
    const mg2 = x.createLinearGradient(0, -50, 0, 50);
    mg2.addColorStop(0, 'rgba(220,230,250,0)');
    mg2.addColorStop(0.5, 'rgba(230,238,252,0.09)');
    mg2.addColorStop(1, 'rgba(220,230,250,0)');
    x.fillStyle = mg2;
    x.fillRect(-1400, -60, 2800, 120);
    x.fillStyle = '#f5f0dc';
    for (let i = 0; i < 650; i++) {
      const t = rng();
      const gx = -1300 + t * 2600;
      const gy = (rng() + rng() + rng() - 1.5) * 120;
      x.globalAlpha = 0.06 + rng() * 0.3;
      x.beginPath(); x.arc(gx, gy, 0.4 + rng() * 1.1, 0, TAU); x.fill();
    }
    x.restore();
    x.globalAlpha = 1;
    // statický hvězdný prach
    x.fillStyle = '#f5f0dc';
    for (let i = 0; i < 300; i++) {
      x.globalAlpha = 0.1 + rng() * 0.35;
      x.beginPath(); x.arc(rng() * W, rng() * 700, 0.4 + rng() * 0.9, 0, TAU); x.fill();
    }
    x.globalAlpha = 1;
  }

  // vzdálené kopce + měsíc
  T.far = mk();
  {
    const x = T.far.getContext('2d');
    // měsíc
    x.fillStyle = '#f0e6c8';
    x.beginPath(); x.arc(1520, 210, 56, 0, TAU); x.fill();
    x.fillStyle = 'rgba(200,190,160,0.5)';
    x.beginPath(); x.arc(1500, 196, 9, 0, TAU); x.fill();
    x.beginPath(); x.arc(1538, 226, 12, 0, TAU); x.fill();
    x.beginPath(); x.arc(1512, 236, 6, 0, TAU); x.fill();
    // kopce
    const hill = (base, amp, col, seed) => {
      const r2 = mulberry(seed);
      x.fillStyle = col;
      x.beginPath();
      x.moveTo(-10, H);
      let y = base;
      for (let px2 = -10; px2 <= W + 10; px2 += 40) {
        y = base + Math.sin(px2 * 0.004 + seed) * amp + (r2() - 0.5) * 18;
        x.lineTo(px2, y);
      }
      x.lineTo(W + 10, H);
      x.closePath(); x.fill();
    };
    hill(600, 46, '#14213a', 3);
    hill(650, 40, '#101b30', 7);
    // sněžný přísvit na hřebenech
    x.strokeStyle = 'rgba(190,205,230,0.14)';
    x.lineWidth = 3;
    x.beginPath();
    for (let px2 = -10; px2 <= W + 10; px2 += 40) {
      const y = 600 + Math.sin(px2 * 0.004 + 3) * 46;
      if (px2 === -10) x.moveTo(px2, y); else x.lineTo(px2, y);
    }
    x.stroke();
  }

  // zámek na návrší
  T.castle = mk();
  {
    const x = T.castle.getContext('2d');
    // návrší
    x.fillStyle = '#0e1830';
    x.beginPath();
    x.moveTo(360, H);
    x.quadraticCurveTo(600, 610, 960, 596);
    x.quadraticCurveTo(1320, 610, 1560, H);
    x.closePath(); x.fill();
    x.strokeStyle = 'rgba(170,190,220,0.16)';
    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(420, 900);
    x.quadraticCurveTo(640, 620, 960, 600);
    x.stroke();
    // silueta zámku
    x.fillStyle = '#111a2e';
    // hlavní křídlo
    x.fillRect(700, 452, 520, 160);
    // cimbuří
    for (let bx = 700; bx < 1220; bx += 40) x.fillRect(bx, 436, 22, 20);
    // velká věž s cibulí
    x.fillRect(1130, 300, 96, 320);
    x.beginPath();
    x.moveTo(1116, 302);
    x.quadraticCurveTo(1178, 210, 1240, 302);
    x.closePath(); x.fill();
    x.beginPath(); x.moveTo(1170, 232); x.lineTo(1186, 232); x.lineTo(1178, 178); x.closePath(); x.fill();
    // observatorní věž
    x.fillRect(806, 320, 110, 300);
    x.beginPath();
    x.moveTo(792, 322);
    x.quadraticCurveTo(861, 240, 930, 322);
    x.closePath(); x.fill();
    // korouhvička
    x.strokeStyle = '#111a2e'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(861, 262); x.lineTo(861, 224); x.stroke();
    x.fillStyle = '#111a2e';
    x.beginPath(); x.moveTo(861, 224); x.lineTo(892, 232); x.lineTo(861, 242); x.closePath(); x.fill();
    // menší štíty
    x.fillRect(640, 500, 70, 112);
    x.beginPath(); x.moveTo(632, 502); x.lineTo(675, 458); x.lineTo(718, 502); x.closePath(); x.fill();
    // okna — spící (studená)
    x.fillStyle = 'rgba(140,160,200,0.12)';
    for (let i = 0; i < 6; i++) x.fillRect(740 + i * 76, 500, 20, 34);
    // teplá okna
    x.fillStyle = 'rgba(255,207,110,0.34)';
    x.fillRect(1156, 420, 18, 28);
    // sněhové linky na římsách
    x.strokeStyle = 'rgba(223,233,245,0.35)';
    x.lineWidth = 3.4;
    x.beginPath(); x.moveTo(700, 452); x.lineTo(1220, 452); x.stroke();
    x.beginPath(); x.moveTo(792, 322); x.quadraticCurveTo(861, 244, 930, 322); x.stroke();
    x.beginPath(); x.moveTo(1116, 302); x.quadraticCurveTo(1178, 214, 1240, 302); x.stroke();
  }

  // střechy Nových Benátek v popředí
  T.roofs = mk();
  {
    const x = T.roofs.getContext('2d');
    const r2 = mulberry(42);
    let bx = -60;
    while (bx < W + 80) {
      const bw = 150 + r2() * 190;
      const bh = 120 + r2() * 130;
      const by = H - bh;
      const peak = by - (40 + r2() * 70);
      x.fillStyle = '#0b1222';
      x.fillRect(bx, by, bw, bh);
      x.beginPath();
      x.moveTo(bx - 8, by);
      x.lineTo(bx + bw / 2, peak);
      x.lineTo(bx + bw + 8, by);
      x.closePath(); x.fill();
      // sníh na hřebeni
      x.strokeStyle = 'rgba(223,233,245,0.85)';
      x.lineWidth = 5;
      x.beginPath();
      x.moveTo(bx - 4, by - 2);
      x.lineTo(bx + bw / 2, peak - 2);
      x.lineTo(bx + bw + 4, by - 2);
      x.stroke();
      // komín
      if (r2() > 0.35) {
        const cx2 = bx + bw * (0.3 + r2() * 0.4);
        const cy2 = peak + (by - peak) * 0.35;
        x.fillStyle = '#0b1222';
        x.fillRect(cx2 - 10, cy2 - 34, 20, 40);
        x.fillStyle = 'rgba(223,233,245,0.8)';
        x.fillRect(cx2 - 12, cy2 - 38, 24, 6);
        T.chimneys.push({ x: cx2, y: cy2 - 38 });
      }
      // teplé okno
      if (r2() > 0.4) {
        x.fillStyle = 'rgba(255,207,110,' + (0.25 + r2() * 0.35) + ')';
        x.fillRect(bx + 20 + r2() * (bw - 60), by + 24 + r2() * (bh - 70), 16, 24);
      }
      bx += bw + 26 + r2() * 60;
    }
  }
  G.title = T;
}

function titleMenuItems() {
  const items = [];
  items.push({ label: S('menu_new'), cb: () => { audio.unlock(); BNJ.startNewGame(); } });
  const has = anySave();
  items.push({ label: S('menu_continue'), cb: has ? () => { audio.unlock(); BNJ.continueGame(); } : null, dim: !has });
  items.push({ label: L2('Nastavení', 'Settings'), cb: () => { audio.unlock(); G.overlay = 'settings'; } });
  items.push({ label: S('menu_lang_label') + ': ' + S('lang_name'), cb: () => BNJ.setLang(BNJ.state.lang === 'cz' ? 'en' : 'cz') });
  return items;
}

function renderTitle(ctx) {
  initTitle();
  const T = G.title, t = G.time;
  const custom = R.scenes.title;
  if (custom) {
    if (!custom._pre) prerender(custom);
    for (const L of custom._pre) {
      ctx.drawImage(L.c, 0, 0);
      if (L.dyn) { try { L.dyn(ctx, t, 0); } catch (e) { err('title layer dynamic', e); } }
    }
    if (custom.dynamic) { try { custom.dynamic(ctx, t, 0); } catch (e) { err('title dynamic', e); } }
    if (custom.overlayDynamic) { try { custom.overlayDynamic(ctx, t, 0); } catch (e) { err('title overlayDynamic', e); } }
  } else {
    ctx.drawImage(T.sky, 0, 0);
    // třpyt hvězd
    ctx.fillStyle = '#f5f0dc';
    for (const s of T.stars) {
      const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = a * 0.85;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // padající hvězda ~ každých 27 s
    {
      const cyc = Math.floor(t / 27);
      const ph = t % 27;
      if (ph < 1.0) {
        const r2 = mulberry(cyc + 11);
        const sx = 200 + r2() * 1300, sy = 80 + r2() * 260;
        const dx2 = 260 + r2() * 200, dy2 = 120 + r2() * 80;
        const p = ph / 1.0;
        const hx = sx + dx2 * p, hy = sy + dy2 * p;
        const grad = ctx.createLinearGradient(hx - dx2 * 0.18, hy - dy2 * 0.18, hx, hy);
        grad.addColorStop(0, 'rgba(245,240,220,0)');
        grad.addColorStop(1, 'rgba(245,240,220,' + (0.9 * Math.sin(p * Math.PI)) + ')');
        ctx.strokeStyle = grad; ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(hx - dx2 * 0.18, hy - dy2 * 0.18);
        ctx.lineTo(hx, hy);
        ctx.stroke();
      }
    }
    // svit měsíce
    {
      const p = 0.9 + Math.sin(t * 0.35) * 0.1;
      const mg = ctx.createRadialGradient(1520, 210, 30, 1520, 210, 170 * p);
      mg.addColorStop(0, 'rgba(240,230,200,0.25)');
      mg.addColorStop(1, 'rgba(240,230,200,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(1520, 210, 170 * p, 0, TAU); ctx.fill();
    }
    ctx.drawImage(T.far, 0, 0);
    ctx.drawImage(T.castle, 0, 0);
    // okno observatoře — Brahe pozoruje (občas zhasne)
    {
      const wv = T.obsWin;
      const cycle = t % 17;
      const on = cycle > 2.2;
      const fl = on ? 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(t * 9.1) * Math.sin(t * 4.7)) : 0.05;
      const wg = ctx.createRadialGradient(wv.x + wv.w / 2, wv.y + wv.h / 2, 4, wv.x + wv.w / 2, wv.y + wv.h / 2, 70);
      wg.addColorStop(0, 'rgba(255,179,71,' + 0.5 * fl + ')');
      wg.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.fillStyle = wg;
      ctx.beginPath(); ctx.arc(wv.x + wv.w / 2, wv.y + wv.h / 2, 70, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,199,101,' + 0.85 * fl + ')';
      ctx.fillRect(wv.x, wv.y, wv.w, wv.h);
      ctx.fillStyle = 'rgba(17,26,46,0.9)';
      ctx.fillRect(wv.x + wv.w / 2 - 2, wv.y, 4, wv.h);
      ctx.fillRect(wv.x, wv.y + wv.h / 2 - 2, wv.w, 4);
    }
    ctx.drawImage(T.roofs, 0, 0);
    // kouř z komínů — analyticky
    for (let ci = 0; ci < T.chimneys.length; ci++) {
      const ch = T.chimneys[ci];
      for (let i = 0; i < 9; i++) {
        const life = ((t * 0.55 + i * 0.47 + ci * 0.31) % 4) / 4;
        const yy = ch.y - life * 130;
        const xx = ch.x + Math.sin(life * 5 + i * 2.1 + ci) * (8 + life * 26);
        const rr2 = 4 + life * 16;
        ctx.fillStyle = 'rgba(159,176,200,' + (0.16 * (1 - life)) + ')';
        ctx.beginPath(); ctx.arc(xx, yy, rr2, 0, TAU); ctx.fill();
      }
    }
    // sníh
    for (const f of T.snow) {
      const yy = (f.y0 + t * f.sp) % (H + 30) - 15;
      const xx = f.x0 + Math.sin(t * 0.8 + f.ph) * f.sw;
      ctx.globalAlpha = f.a;
      ctx.fillStyle = '#dfe9f5';
      ctx.beginPath(); ctx.arc(((xx % (W + 40)) + W + 40) % (W + 40) - 20, yy, f.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // vinětace
    const vg = ctx.createRadialGradient(W / 2, H * 0.42, 300, W / 2, H * 0.5, 1200);
    vg.addColorStop(0, 'rgba(4,6,14,0)');
    vg.addColorStop(1, 'rgba(4,6,14,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- titul + menu (vždy engine) ----
  const ty = 268 + Math.sin(t * 0.8) * 4;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 118px ' + FONT;
  ctx.shadowColor = 'rgba(232,182,76,0.55)';
  ctx.shadowBlur = 34;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(20,12,4,0.9)';
  ctx.lineWidth = 12;
  ctx.strokeText(S('title'), W / 2, ty);
  const tg = ctx.createLinearGradient(0, ty - 100, 0, ty + 16);
  tg.addColorStop(0, '#f6d88a');
  tg.addColorStop(0.55, '#e8b64c');
  tg.addColorStop(1, '#b17c22');
  ctx.fillStyle = tg;
  ctx.fillText(S('title'), W / 2, ty);
  ctx.shadowBlur = 0;
  ctx.restore();
  outText(ctx, S('subtitle'), W / 2, ty + 62, { size: 33, color: '#b8cfe8', sw: 5 });
  outText(ctx, S('tagline'), W / 2, ty + 104, { size: 24, color: 'rgba(184,207,232,0.75)', sw: 4 });

  // menu — iluminované položky: tmavý pergamenový pás s vlaštovčími konci,
  // zlatý lem, zlacená kapitálka (žádný holý bílý text)
  const items = titleMenuItems();
  let y = 668;
  for (const it of items) {
    const label = String(it.label);
    const cap = label.charAt(0), rest = label.slice(1);
    ctx.font = 'bold 46px ' + FONT;
    const capW = ctx.measureText(cap).width;
    ctx.font = '35px ' + FONT;
    const restW = ctx.measureText(rest).width;
    const tw = capW + restW;
    const bw = tw + 128, bh = 58;
    const x0 = W / 2 - bw / 2, y0 = y - 40;
    const hov = !it.dim && it.cb && uiBtn(x0, y0, bw, bh, it.cb);
    ctx.save();
    // pás s vykrojenými (vlaštovčími) konci
    ctx.globalAlpha = it.dim ? 0.45 : (hov ? 1 : 0.88);
    const bg = ctx.createLinearGradient(0, y0, 0, y0 + bh);
    bg.addColorStop(0, hov ? 'rgba(56,42,20,0.88)' : 'rgba(22,22,36,0.72)');
    bg.addColorStop(0.5, hov ? 'rgba(40,30,14,0.88)' : 'rgba(14,14,26,0.72)');
    bg.addColorStop(1, hov ? 'rgba(28,20,10,0.88)' : 'rgba(8,9,18,0.72)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + bw, y0);
    ctx.lineTo(x0 + bw - 17, y0 + bh / 2);
    ctx.lineTo(x0 + bw, y0 + bh);
    ctx.lineTo(x0, y0 + bh);
    ctx.lineTo(x0 + 17, y0 + bh / 2);
    ctx.closePath();
    ctx.fill();
    // zlatý lem pásu
    ctx.strokeStyle = it.dim ? 'rgba(150,140,110,0.30)'
      : (hov ? 'rgba(240,196,110,0.95)' : 'rgba(210,168,90,0.5)');
    ctx.lineWidth = hov ? 2.5 : 1.8;
    ctx.stroke();
    // drobné zlaté routy na špičkách zářezů
    ctx.fillStyle = it.dim ? 'rgba(150,140,110,0.35)' : (hov ? '#f2ca74' : 'rgba(210,168,90,0.7)');
    for (const dx of [26, bw - 26]) {
      ctx.beginPath();
      ctx.moveTo(x0 + dx, y0 + bh / 2 - 5);
      ctx.lineTo(x0 + dx + 4.5, y0 + bh / 2);
      ctx.lineTo(x0 + dx, y0 + bh / 2 + 5);
      ctx.lineTo(x0 + dx - 4.5, y0 + bh / 2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // text: zlacená kapitálka + řezaný serif se stínem
    const tx0 = W / 2 - tw / 2;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.lineJoin = 'round';
    const goldG = ctx.createLinearGradient(0, y - 36, 0, y + 8);
    goldG.addColorStop(0, '#f6d88a');
    goldG.addColorStop(0.55, '#e8b64c');
    goldG.addColorStop(1, '#b17c22');
    if (hov) { ctx.shadowColor = 'rgba(232,182,76,0.55)'; ctx.shadowBlur = 14; }
    // kapitálka
    ctx.font = 'bold 46px ' + FONT;
    ctx.strokeStyle = 'rgba(14,10,6,0.9)'; ctx.lineWidth = 6;
    ctx.strokeText(cap, tx0, y + 2);
    ctx.fillStyle = it.dim ? 'rgba(150,155,170,0.5)' : goldG;
    ctx.fillText(cap, tx0, y + 2);
    // zbytek slova
    ctx.font = '35px ' + FONT;
    ctx.strokeStyle = 'rgba(14,10,6,0.85)'; ctx.lineWidth = 5;
    ctx.strokeText(rest, tx0 + capW, y);
    ctx.fillStyle = it.dim ? 'rgba(140,148,164,0.45)' : (hov ? goldG : '#ecdfbe');
    ctx.fillText(rest, tx0 + capW, y);
    ctx.restore();
    y += 76;
  }
  outText(ctx, S('footer'), W / 2, H - 30, { size: 19, color: 'rgba(159,176,200,0.55)', sw: 3 });
  outText(ctx, L2('verze 2 · světlo, zvuk a hratelnost', 'version 2 · light, sound & play'), W - 40, H - 30, { size: 18, color: 'rgba(232,182,76,0.6)', sw: 3, align: 'right' });
}

/* -------------------------------------------- v2: pára od úst (zima!) */
const _puffs = [];
function updatePuffs(dt) {
  const def = G.scene;
  for (let i = _puffs.length - 1; i >= 0; i--) { _puffs[i].t += dt; if (_puffs[i].t > 2.2) _puffs.splice(i, 1); }
  if (!def || def.interior || def.id === 'observatory' || G.overlay) return;
  for (const a of actorsList()) {
    const ref = a.ref;
    const talking = G.say && G.say.c === a.id;
    ref._puffT = (ref._puffT == null ? Math.random() * 3 : ref._puffT) - dt * (talking ? 2.6 : 1);
    if (ref._puffT <= 0) {
      ref._puffT = 2.6 + Math.random() * 1.8;
      const ch = R.characters[a.id];
      const sc = sceneScale(a.y), hh = ((ch && ch.height) || 320) * sc;
      _puffs.push({ x: a.x + (a.dir || 1) * 26 * sc, y: a.y - hh * 0.8, dir: a.dir || 1, sc, t: 0, scene: G.sceneId });
    }
  }
}
function renderPuffs(ctx) {
  if (!_puffs.length) return;
  ctx.save();
  ctx.translate(-G.camX, 0);
  for (const p of _puffs) {
    if (p.scene !== G.sceneId) continue;
    const k = p.t / 2.2;
    const a = 0.28 * Math.sin(Math.PI * Math.min(1, k * 1.15)) * (1 - k);
    if (a <= 0.005) continue;
    for (let j = 0; j < 3; j++) {
      const x = p.x + p.dir * (10 + k * 46 + j * 9) * p.sc;
      const y = p.y - (k * 24 + j * 4) * p.sc;
      const r = (7 + k * 26 + j * 4) * p.sc;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(240,246,255,' + (a * (1 - j * 0.25)).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(240,246,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------- update */
function update(dt) {
  G.time += dt;
  // fader
  const fd = G.faderTarget - G.fader;
  if (Math.abs(fd) > 0.0005) {
    G.fader += clamp(fd, -dt * 2.6, dt * 2.6);
    if (Math.abs(G.faderTarget - G.fader) <= 0.0005) {
      G.fader = G.faderTarget;
      const f = G.faderCb; G.faderCb = null;
      if (f) safeCall(f);
    }
  }
  // toasty
  for (const t2 of G.toasts) t2.t += dt;
  G.toasts = G.toasts.filter(t2 => t2.t < 3.4);
  if (G.invFlash) { G.invFlash.t += dt; if (G.invFlash.t > 0.9) G.invFlash = null; }
  if (G.invPeekT > 0) G.invPeekT -= dt;
  if (G.sceneNameT > 0) G.sceneNameT -= dt;

  if (G.mode !== 'play') return;
  if (G.overlay) return;

  // cutscéna: čekání
  if (G.cut && G.cut.wait > 0) {
    G.cut.wait -= dt;
    if (G.cut.wait <= 0) {
      const n = G.cut.next; G.cut.next = null;
      if (n) n();
    }
  }
  // řeč
  if (!G.say && G.sayQ.length) startSay(G.sayQ.shift());
  if (G.say) {
    G.say.time += dt;
    if (G.say.time >= G.say.dur) endSay(false);
  }
  // hráč
  const p = G.player, def = G.scene;
  if (def && p.walking) {
    const sc = sceneScale(p.y);
    const spd = p.speed * Math.max(0.35, sc) * (p.run ? 1.85 : 1);
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 5) {
      p.walking = false; p.run = false;
      if (p.faceDir) { p.dir = p.faceDir; p.faceDir = 0; }
      const f = p.onArrive; p.onArrive = null;
      if (f) safeCall(f);
    } else {
      const step = Math.min(d, spd * dt);
      let nx = p.x + (dx / d) * step, ny = p.y + (dy / d) * step;
      if (Math.abs(dx) > 3) p.dir = dx > 0 ? 1 : -1;
      const wa = def.walkArea;
      if (wa && wa.length > 2 && !pointInPoly(nx, ny, wa)) {
        if (pointInPoly(nx, p.y, wa)) { ny = p.y; p.ty = p.y; }
        else if (pointInPoly(p.x, ny, wa)) { nx = p.x; p.tx = p.x; }
        else {
          p.walking = false;
          const f = p.onArrive; p.onArrive = null;
          if (f) safeCall(f);
          nx = p.x; ny = p.y;
        }
      }
      const prevPh = p.ph;
      p.ph += step * 0.010 / (p.run ? 1.25 : 1);
      if (Math.floor(prevPh * 2) !== Math.floor(p.ph * 2)) {
        const pan = clamp(((p.x - G.camX) / W) * 2 - 1, -1, 1) * 0.6;
        const surf = def.stepSfx || (def.interior || def.id === 'observatory' ? 'sfx_step_wood' : 'sfx_snow_step');
        BNJ.sfx(surf, { pan, vol: p.run ? 1.15 : 1 });
        addFootprint();
      }
      p.x = nx; p.y = ny;
    }
  }
  // kamera
  if (def) {
    const target = clamp(p.x - W / 2, 0, def.width - W);
    G.camX = lerp(G.camX, target, 1 - Math.exp(-dt * 4.2));
    if (G.camLock != null) G.camX = clamp(G.camLock, 0, def.width - W);
  }
  updatePuffs(dt);
  G.showHsT = clamp(G.showHsT + ((G.showHs || G.hsKey) ? dt * 5 : -dt * 4), 0, 1);
  computeHover();
  if (G.hover && (!G.hovPrev || G.hover.hs !== G.hovPrev.hs || G.hover.exit !== G.hovPrev.exit)) BNJ.sfx('sfx_ui_hover');
  G.hovPrev = G.hover;
}

/* -------------------------------------------------------------- render */
function render() {
  const ctx = G.ctx;
  if (!ctx) return;
  G.ui.length = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#04060c';
  ctx.fillRect(0, 0, W, H);
  if (G.mode === 'title') {
    renderTitle(ctx);
    if (BNJ.fx) { try { BNJ.fx.screenFx(ctx, G.time, 'title'); } catch (e) { err('fx title', e); } }
  } else {
    renderScene(ctx);
    renderClickFx(ctx);
    renderHotspotHighlight(ctx);
    renderCutBars(ctx);
    renderSceneName(ctx);
    renderInventory(ctx);
    renderFlyItems(ctx);
    renderDialogChoices(ctx);
    renderSay(ctx);
    if (!G.overlay) { renderHoverLabel(ctx); renderCoin(ctx); }
    renderTopButtons(ctx);
  }
  renderToasts(ctx);
  if (G.overlay) renderOverlay(ctx);
  if (G.fader > 0.001) renderFader(ctx);
  renderCursor(ctx);
}

/* v2: kruhová clona (iris) à la klasické adventury, soustředěná na Jiříka */
function renderFader(ctx) {
  const f = G.fader;
  if (G.mode !== 'play' || !G.scene || BNJ.settings.fx === 0 || f > 0.995) {
    ctx.fillStyle = 'rgba(2,3,8,' + (f > 0.995 ? 1 : f).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  const e = f * f * (3 - 2 * f);
  const sc = sceneScale(G.player.y);
  const cx = clamp(G.player.x - G.camX, 0, W), cy = G.player.y - 150 * sc;
  const maxR = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 20;
  const r = Math.max(0, (1 - e) * maxR);
  ctx.save();
  ctx.fillStyle = '#020308';
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.arc(cx, cy, r, 0, TAU, true);
  ctx.fill();
  if (r > 2) {
    const g = ctx.createRadialGradient(cx, cy, Math.max(0, r - 60), cx, cy, r);
    g.addColorStop(0, 'rgba(2,3,8,0)'); g.addColorStop(1, 'rgba(2,3,8,0.85)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(232,182,76,' + (0.5 * Math.sin(Math.PI * e)).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(2,3,8,' + (e * 0.25).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ---------------------------------------------------------------- loop */
let _lastTs = 0, _frameErrT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!_lastTs) _lastTs = ts;
  _dt = clamp((ts - _lastTs) / 1000, 0, 0.05);
  _lastTs = ts;
  try {
    update(_dt);
    render();
  } catch (e) {
    if (ts - _frameErrT > 1000) { _frameErrT = ts; err('Chyba ve frame', e); }
  }
}

/* ---------------------------------------------------------------- boot */
BNJ.boot = function (opts) {
  if (G.booted) return;
  G.booted = true;
  try { BNJ.state.lang = localStorage.getItem('bnj_lang') === 'en' ? 'en' : 'cz'; } catch (e) { /* ignore */ }
  const host = (opts && opts.parent) || document.getElementById('game') || document.body;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  cv.style.cursor = 'none';
  host.appendChild(cv);
  G.canvas = cv;
  G.ctx = cv.getContext('2d');

  function resize() {
    const w2 = window.innerWidth, h2 = window.innerHeight;
    const s = Math.min(w2 / W, h2 / H);
    G.cssScale = s;
    cv.style.width = Math.round(W * s) + 'px';
    cv.style.height = Math.round(H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function toGame(e) {
    const r2 = cv.getBoundingClientRect();
    return [
      clamp((e.clientX - r2.left) / (r2.width / W), 0, W),
      clamp((e.clientY - r2.top) / (r2.height / H), 0, H)
    ];
  }
  cv.addEventListener('mousemove', (e) => {
    const p = toGame(e);
    G.mouse.x = p[0]; G.mouse.y = p[1]; G.mouse.inside = true;
  });
  cv.addEventListener('mouseleave', () => { G.mouse.inside = false; G.mouse.x = -100; G.mouse.y = -100; G.mouse.down = false; });
  cv.addEventListener('mousedown', (e) => {
    audio.unlock();
    const p = toGame(e);
    G.mouse.x = p[0]; G.mouse.y = p[1]; G.mouse.inside = true;
    if (e.button === 0) { G.mouse.down = true; onClick(); }
    else if (e.button === 2) onRightClick();
  });
  window.addEventListener('mouseup', () => {
    G.mouse.down = false;
    if (G._setDirty) { G._setDirty = false; BNJ.saveSettings(); }
  });
  // v2: dotyk — klepnutí = klik, podržení (0,5 s) = prohlédnout
  let _lp = null;
  cv.addEventListener('touchstart', (e) => {
    audio.unlock();
    G.touch = true;
    const t0 = e.changedTouches[0];
    const p = toGame(t0);
    G.mouse.x = p[0]; G.mouse.y = p[1]; G.mouse.inside = true;
    computeHover();
    _lp = { x: p[0], y: p[1], fired: false, timer: setTimeout(() => { _lp.fired = true; onRightClick(); }, 520) };
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', (e) => {
    const p = toGame(e.changedTouches[0]);
    G.mouse.x = p[0]; G.mouse.y = p[1];
    if (_lp && dist(p[0], p[1], _lp.x, _lp.y) > 24) { clearTimeout(_lp.timer); }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', (e) => {
    if (_lp) {
      clearTimeout(_lp.timer);
      if (!_lp.fired) { computeHover(); onClick(); }
      _lp = null;
    }
    G.mouse.inside = false;
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => {
    if (G.overlay === 'journal') {
      G.jScroll = clamp(G.jScroll + e.deltaY * 0.7, 0, G._jMax || 0);
      e.preventDefault();
    }
  }, { passive: false });
  window.addEventListener('keydown', (e) => { audio.unlock(); onKey(e); });
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { G.hsKey = false; });

  G.mode = 'title';
  G.fader = 1;
  audio.play('title_theme');
  audio.playAmbience('amb_title');
  fadeTo(0);
  requestAnimationFrame(frame);
};

})();

/* stopy — vyšlapaná pěšina ve sněhu */
function trodden(ctx, x0, y0, x1, y1, wdt, seed, col) {
  const r = mulberry(seed);
  const n = 26;
  ctx.fillStyle = col || 'rgba(157,180,214,0.5)';
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const px = lerp(x0, x1, t) + (r() - 0.5) * wdt * 0.7;
    const py = lerp(y0, y1, t) + (r() - 0.5) * 14;
    ctx.globalAlpha = 0.25 + r() * 0.4;
    ctx.beginPath(); ctx.ellipse(px, py, 9 + r() * 8, 3.5 + r() * 2.5, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

          // mech + praskliny
          x.fillStyle = 'rgba(104,120,84,0.5)';
          x.beginPath(); x.ellipse(-6, -60, 6, 14, 0.2, 0, TAU); x.fill();
          x.strokeStyle = 'rgba(40,40,48,0.5)'; x.lineWidth = 1.6;
          x.beginPath(); x.moveTo(4, -10); x.lineTo(7, -52); x.lineTo(3, -80); x.stroke();
          x.restore();

          /* --- ZAMRZLÁ TŮŇ s přimrzlým fragmentem (popředí, střed) --- */
          x.save();
          // tvar tůně
          const poolPath = () => {
            x.beginPath();
            x.moveTo(880, 1006);
            x.bezierCurveTo(920, 962, 1080, 946, 1230, 952);
            x.bezierCurveTo(1420, 946, 1550, 972, 1584, 1010);
            x.bezierCurveTo(1600, 1046, 1520, 1076, 1230, 1080);
            x.bezierCurveTo(1000, 1080, 872, 1052, 880, 1006);
            x.closePath();
          };
          // tmavá hloubka
          poolPath();
          x.fillStyle = lg(x, 0, 950, 0, 1080, [[0, '#5e7a86'], [0.5, '#4e6470'], [1, '#3a505c']]);
          x.fill();
          // ledová deska — mléčné víry
          poolPath();
          x.save();
          x.clip();
          x.fillStyle = 'rgba(154,180,188,0.65)';
          x.fillRect(860, 940, 760, 150);
          scumble(x, 880, 946, 720, 130, 10131, 90, ['rgba(214,230,238,0.8)', 'rgba(120,146,158,0.6)', 'rgba(240,248,252,0.7)'], 8, 40, 0.35);
          // bubliny pod ledem
          const rb = mulberry(10132);
          for (let i = 0; i < 22; i++) {
            x.fillStyle = 'rgba(220,240,246,' + (0.2 + rb() * 0.4) + ')';
            x.beginPath();
            x.arc(920 + rb() * 640, 970 + rb() * 90, 1.5 + rb() * 4, 0, TAU);
            x.fill();
          }
          // FRAGMENT LISTU (~1230,1010) se kreslí v dynamic() — po vyzvednutí
          // musí zmizet a statická vrstva se prerenderuje jen jednou za session
          // mléčný závoj ledu přes fragment — měkké elipsy
          mistPuff(x, 1210, 1000, 130, 46, '190,210,220', 0.5);
          mistPuff(x, 1290, 1024, 100, 36, '196,214,224', 0.4);
          mistPuff(x, 1160, 980, 80, 30, '200,218,226', 0.35);
          // velké praskliny
          x.strokeStyle = 'rgba(230,244,250,0.65)'; x.lineWidth = 2.6;
          x.beginPath();
          x.moveTo(940, 990); x.lineTo(1060, 1002); x.lineTo(1150, 986); x.lineTo(1310, 1010);
          x.stroke();
          x.beginPath();
          x.moveTo(1310, 1010); x.lineTo(1420, 996); x.lineTo(1530, 1018);
          x.stroke();
          x.lineWidth = 1.4;
          x.beginPath(); x.moveTo(1150, 986); x.lineTo(1180, 950); x.stroke();
          x.beginPath(); x.moveTo(1060, 1002); x.lineTo(1044, 1046); x.stroke();
          x.restore();
          // zasněžený lem tůně
          poolPath();
          x.strokeStyle = 'rgba(236,243,250,0.9)'; x.lineWidth = 9;
          x.stroke();
          x.restore();

          /* --- STARÝ DUB (kmen walkBehind, koruna přes scénu) --- */
          x.save();
          const ox = 1836;
          contactShadow(x, ox, 1072, 150, 20, 1.1, '52,64,86');
          // kořenové náběhy
          x.fillStyle = '#3e3428';
          fillP(x, [[ox - 98, 1080], [ox - 66, 980], [ox - 40, 1080]], '#3e3428');
          fillP(x, [[ox + 34, 1080], [ox + 66, 986], [ox + 102, 1080]], '#3e3428');
          // kmen
          const tg = lg(x, ox - 70, 0, ox + 70, 0, [[0, '#4a4034'], [0.45, '#3e3428'], [1, '#2a2218']]);
          x.fillStyle = tg;
          x.beginPath();
          x.moveTo(ox - 78, 1080);
          x.bezierCurveTo(ox - 66, 940, ox - 58, 860, ox - 34, 780);
          x.lineTo(ox - 20, 730);
          x.lineTo(ox + 30, 730);
          x.bezierCurveTo(ox + 48, 800, ox + 62, 900, ox + 78, 1080);
          x.closePath(); x.fill();
          // borka — svislé rozpraskané rýhy
          x.strokeStyle = 'rgba(16,12,8,0.6)'; x.lineWidth = 3.4;
          for (let i = 0; i < 8; i++) {
            const bx = ox - 62 + i * 17;
            x.beginPath();
            x.moveTo(bx + 8, 1076);
            x.bezierCurveTo(bx + 4 + Math.sin(i * 3) * 6, 980, bx + 10, 880, bx + 16 + Math.sin(i) * 4, 760);
            x.stroke();
          }
          x.strokeStyle = 'rgba(200,214,228,0.25)'; x.lineWidth = 2.4;
          x.beginPath();
          x.moveTo(ox - 58, 1060); x.bezierCurveTo(ox - 52, 950, ox - 44, 860, ox - 26, 764);
          x.stroke();
          // dutina se zbytky žaludů
          x.fillStyle = '#171008';
          x.beginPath(); x.ellipse(ox + 26, 920, 16, 26, 0.12, 0, TAU); x.fill();
          x.strokeStyle = '#4a4034'; x.lineWidth = 4;
          x.beginPath(); x.ellipse(ox + 26, 920, 16, 26, 0.12, 0, TAU); x.stroke();
          // hlavní větve do koruny
          x.strokeStyle = '#352c20'; x.lineCap = 'round';
          const branch = (x0, y0, x1, y1, w0) => {
            x.lineWidth = w0;
            x.beginPath(); x.moveTo(x0, y0); x.quadraticCurveTo((x0 + x1) / 2 + 20, (y0 + y1) / 2 - 30, x1, y1); x.stroke();
          };
          branch(ox - 10, 745, ox - 250, 560, 30);
          branch(ox + 16, 740, ox + 240, 540, 32);
          branch(ox, 742, ox - 60, 460, 26);
          branch(ox + 8, 745, ox + 110, 430, 22);
          // vedlejší větvoví
          branch(ox - 250, 560, ox - 420, 470, 14);
          branch(ox - 250, 560, ox - 330, 620, 10);
          branch(ox - 60, 460, ox - 180, 360, 12);
          branch(ox - 60, 460, ox + 20, 330, 10);
          branch(ox + 110, 430, ox + 240, 330, 11);
          branch(ox + 240, 540, ox + 420, 480, 13);
          branch(ox + 240, 540, ox + 350, 620, 9);
          // jemné konce
          x.lineWidth = 4;
          const rt = mulberry(10141);
          const tips = [[-420, 470], [-330, 620], [-180, 360], [20, 330], [240, 330], [420, 480], [350, 620]];
          for (const tp of tips) {
            for (let k = 0; k < 5; k++) {
              const a = rt() * TAU;
              x.beginPath();
              x.moveTo(ox + tp[0], tp[1]);
              x.quadraticCurveTo(
                ox + tp[0] + Math.cos(a) * 30, tp[1] + Math.sin(a) * 26 - 14,
                ox + tp[0] + Math.cos(a) * 66, tp[1] + Math.sin(a) * 52 - 20
              );
              x.stroke();
            }
          }
          // DUBĚNKY — hnědé kuličky na koncích větví
          for (const tp of tips) {
            for (let k = 0; k < 4; k++) {
              const gx = ox + tp[0] + (rt() - 0.5) * 90;
              const gy = tp[1] + (rt() - 0.5) * 70;
              x.fillStyle = k % 2 ? '#6a4a2a' : '#7a5a34';
              x.beginPath(); x.arc(gx, gy, 5 + rt() * 3, 0, TAU); x.fill();
              x.fillStyle = 'rgba(230,220,200,0.35)';
              x.beginPath(); x.arc(gx - 1.5, gy - 1.5, 1.6, 0, TAU); x.fill();
            }
          }
          // pár scvrklých dubových listů
          x.fillStyle = '#6e5a30';
          for (let k = 0; k < 14; k++) {
            const tp = tips[(rt() * tips.length) | 0];
            const lx = ox + tp[0] + (rt() - 0.5) * 110;
            const ly = tp[1] + (rt() - 0.5) * 80;
            x.save();
            x.translate(lx, ly);
            x.rotate(rt() * TAU);
            x.beginPath();
            x.moveTo(0, -7);
            x.bezierCurveTo(6, -4, 6, 4, 0, 8);
            x.bezierCurveTo(-6, 4, -6, -4, 0, -7);
            x.fill();
            x.restore();
          }
          // sníh na hlavních větvích
          snowBand(x, [[ox - 250, 556], [ox - 120, 640], [ox - 6, 742]], 9, 10142, '#e8eef8', '#8a9cb4');
          snowBand(x, [[ox + 18, 738], [ox + 130, 640], [ox + 238, 538]], 9, 10143, '#e8eef8', '#8a9cb4');
          snowBand(x, [[ox - 60, 458], [ox - 20, 560], [ox + 4, 660]], 7, 10144, '#e8eef8', '#95a8c0');
          x.restore();

          /* --- volavčí tůňka vpravo (mělká, u pěšiny) --- */
          x.save();
          x.beginPath();
          x.ellipse(2280, 880, 190, 42, 0, 0, TAU);
          x.fillStyle = lg(x, 0, 840, 0, 920, [[0, '#7e98a4'], [1, '#54707c']]);
          x.fill();
          x.fillStyle = 'rgba(178,200,208,0.6)';
          x.beginPath(); x.ellipse(2340, 886, 90, 20, 0, 0, TAU); x.fill();
          x.strokeStyle = 'rgba(236,243,250,0.85)'; x.lineWidth = 7;
          x.beginPath(); x.ellipse(2280, 880, 190, 42, 0, 0, TAU); x.stroke();
          // nezamrzlé očko s odrazem nebe
          x.fillStyle = 'rgba(170,182,192,0.9)';
          x.beginPath(); x.ellipse(2226, 874, 52, 13, 0, 0, TAU); x.fill();
          x.fillStyle = 'rgba(218,206,186,0.5)';
          x.beginPath(); x.ellipse(2214, 872, 20, 6, 0, 0, TAU); x.fill();
          x.restore();

          /* --- přední rákosí a ostřice (walkBehind) --- */
          const frontReeds = (cx, cy, n, seed, sc) => {
            const rr2 = mulberry(seed);
            for (let i = 0; i < n; i++) {
              const bx = cx + (rr2() - 0.5) * 220 * sc;
              const by = cy + (rr2() - 0.5) * 40;
              const hh = (90 + rr2() * 110) * sc;
              const lean = (rr2() - 0.5) * 0.5;
              x.strokeStyle = rr2() > 0.5 ? '#8a7a4e' : '#5e5638';
              x.lineWidth = 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.quadraticCurveTo(bx + lean * 26, by - hh * 0.6, bx + lean * 56, by - hh);
              x.stroke();
              if (rr2() > 0.5) {
                x.fillStyle = '#6a5230';
                x.save();
                x.translate(bx + lean * 56, by - hh);
                x.rotate(lean * 0.5);
                x.fillRect(-4.4, -26, 9, 28);
                x.fillStyle = '#eef3fa';
                x.fillRect(-4.4, -29, 9, 6);
                x.restore();
              }
            }
          };
          contactShadow(x, 210, 1052, 110, 14, 0.7, '52,64,86');
          contactShadow(x, 2510, 1058, 100, 13, 0.7, '52,64,86');
          frontReeds(210, 1046, 42, 10151, 1.25);
          frontReeds(2510, 1052, 36, 10152, 1.15);
          snowBand(x, [[90, 1010], [330, 1000]], 12, 10153, '#eef3fa', '#a9bedd');
          snowBand(x, [[2430, 1016], [2596, 1012]], 10, 10154, '#eef3fa', '#a9bedd');
          // globální malířské zrno
          grain(x, SW, H, 0.05);
        }
      }
    ],
    dynamic(ctx, t, camX) {
      /* FRAGMENT LISTU přimrzlý pod ledem — dynamicky, aby po vyzvednutí
         zmizel. Podmínka zrcadlí hs_ma_ice_pool v 50_puzzles.js. */
      {
        const st = BNJ.state;
        if (!(st.inventory.includes('frag_c') || st.flags._frag_c_in || st.flags.letter_read)) {
          ctx.save();
          ctx.translate(1230, 1010);
          ctx.rotate(-0.18);
          fillP(ctx, [[-34, -20], [30, -26], [38, 16], [-26, 24]], 'rgba(232,220,190,0.72)');
          ctx.strokeStyle = 'rgba(122,92,52,0.5)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-22, -8); ctx.lineTo(24, -12); ctx.moveTo(-20, 2); ctx.lineTo(26, -1); ctx.moveTo(-18, 12); ctx.lineTo(20, 9); ctx.stroke();
          ctx.fillStyle = 'rgba(138,44,34,0.7)';
          ctx.beginPath(); ctx.arc(22, 10, 8, 0, TAU); ctx.fill();
          ctx.restore();
          // mléčný závoj navrch, ať fragment zůstane čitelně „pod ledem“
          mistPuff(ctx, 1210, 1000, 130, 46, '190,210,220', 0.35);
          mistPuff(ctx, 1290, 1024, 100, 36, '196,214,224', 0.3);
        }
      }

      /* vlnící se rákosí (několik dynamických stébel přes statické trsy) */
      {
        const rr2 = mulberry(10301);
        for (let i = 0; i < 14; i++) {
          const bx = rr2() * SW;
          const by = 830 + rr2() * 60;
          const hh = 70 + rr2() * 80;
          const ph = rr2() * TAU;
          const sway = Math.sin(t * 1.1 + ph) * 8 + Math.sin(t * 2.3 + ph * 2) * 3;
          ctx.strokeStyle = 'rgba(138,122,78,0.55)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx + sway * 0.5, by - hh * 0.6, bx + sway, by - hh);
          ctx.stroke();
        }
      }

      /* BLUDIČKY — tři zelenkavá světélka nad tůněmi */
      {
        const anchors = [[500, 760], [1200, 800], [2350, 780]];
        for (let i = 0; i < anchors.length; i++) {
          const [ax, ay] = anchors[i];
          const wx = ax + Math.sin(t * (0.31 + i * 0.07) + i * 2.1) * 110 + Math.sin(t * 0.83 + i) * 30;
          const wy = ay + Math.sin(t * (0.47 + i * 0.05) + i * 4.2) * 42 + Math.cos(t * 1.1 + i * 2) * 12;
          const fl = 0.55 + 0.45 * Math.sin(t * (2.2 + i * 0.6) + i * 3) * Math.sin(t * 3.7 + i);
          // duch stopy
          for (let k = 1; k <= 2; k++) {
            const tx2 = ax + Math.sin((t - k * 0.16) * (0.31 + i * 0.07) + i * 2.1) * 110 + Math.sin((t - k * 0.16) * 0.83 + i) * 30;
            const ty2 = ay + Math.sin((t - k * 0.16) * (0.47 + i * 0.05) + i * 4.2) * 42 + Math.cos((t - k * 0.16) * 1.1 + i * 2) * 12;
            glow(ctx, tx2, ty2, 14, '174,240,200', 0.10 * fl / k);
          }
          glow(ctx, wx, wy, 52, '174,240,200', 0.30 * fl);
          glow(ctx, wx, wy, 20, '210,255,225', 0.5 * fl);
          ctx.fillStyle = 'rgba(235,255,240,' + (0.85 * fl) + ')';
          ctx.beginPath(); ctx.arc(wx, wy, 3.2, 0, TAU); ctx.fill();
          // odraz na ledu pod bludičkou
          ctx.fillStyle = 'rgba(174,240,200,' + (0.10 * fl) + ')';
          ctx.beginPath(); ctx.ellipse(wx, 900 + i * 30, 34, 7, 0, 0, TAU); ctx.fill();
        }
      }

      /* VOLAVKA — stojí na jedné noze, občas zaloví */
      {
        const hx = 2280, hy = 866;
        const cyc = t % 16;
        let neckDip = 0;
        if (cyc > 11 && cyc < 12) neckDip = Math.sin((cyc - 11) * Math.PI);          // rychlý úder
        else if (cyc >= 12 && cyc < 14) neckDip = Math.max(0, 1 - (cyc - 12) * 0.7); // zvedá hlavu
        const sway = Math.sin(t * 0.8) * 2;
        ctx.save();
        ctx.translate(hx, hy);
        // noha
        ctx.strokeStyle = '#4a4a44'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1, -44); ctx.stroke();
        // druhá přitažená
        ctx.beginPath(); ctx.moveTo(2, -40); ctx.lineTo(10, -30); ctx.stroke();
        // tělo
        ctx.fillStyle = '#9aa4ac';
        ctx.beginPath(); ctx.ellipse(4 + sway * 0.4, -62, 26, 15, -0.16, 0, TAU); ctx.fill();
        ctx.fillStyle = '#7e8890';
        ctx.beginPath(); ctx.ellipse(-6 + sway * 0.4, -56, 14, 9, -0.3, 0, TAU); ctx.fill();
        // ocásek
        fillP(ctx, [[-20, -66], [-34, -58], [-18, -54]], '#7e8890');
        // krk + hlava (S křivka, při lovu vystřelí dolů)
        const hdx = 30 + sway - neckDip * 16;
        const hdy = -96 + neckDip * 74;
        ctx.strokeStyle = '#c8ccd0'; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(20, -70);
        ctx.quadraticCurveTo(38 - neckDip * 10, -92 + neckDip * 30, hdx, hdy);
        ctx.stroke();
        ctx.fillStyle = '#c8ccd0';
        ctx.beginPath(); ctx.ellipse(hdx, hdy, 8, 6, -0.2, 0, TAU); ctx.fill();
        // zobák
        ctx.fillStyle = '#c9a24a';
        fillP(ctx, [[hdx + 5, hdy - 2], [hdx + 26, hdy + 2 + neckDip * 6], [hdx + 5, hdy + 3]], '#c9a24a');
        // černý proužek za okem
        ctx.strokeStyle = '#2c3038'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(hdx - 2, hdy - 5); ctx.lineTo(hdx - 12, hdy - 12); ctx.stroke();
        ctx.fillStyle = '#241812';
        ctx.beginPath(); ctx.arc(hdx + 1, hdy - 1.6, 1.7, 0, TAU); ctx.fill();
        ctx.restore();
        // cáknutí při úderu
        if (cyc > 11.2 && cyc < 11.8) {
          const p = (cyc - 11.2) / 0.6;
          ctx.fillStyle = 'rgba(220,236,242,' + (0.6 * (1 - p)) + ')';
          for (let k = 0; k < 5; k++) {
            const a = -0.6 - k * 0.4;
            ctx.beginPath();
            ctx.arc(2310 + Math.cos(a) * 20 * p * 2, 850 + Math.sin(a) * 24 * p, 2.4, 0, TAU);
            ctx.fill();
          }
        }
      }

      /* praskání ledu — trhlina se rozběhne po tůni (~40 s) + SFX */
      {
        const per = 41;
        const cyc = Math.floor(t / per), ph = t % per;
        if (ph < 1.6) {
          if (cyc !== _lastCrack) { _lastCrack = cyc; try { BNJ.sfx('sfx_ice_crack'); } catch (e) { } }
          const p = ph / 1.6;
          const rc = mulberry(cyc * 7 + 3);
          const sx = 950 + rc() * 500, sy = 970 + rc() * 80;
          ctx.strokeStyle = 'rgba(240,250,255,' + (0.8 * (1 - p * 0.5)) + ')';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          let px2 = sx, py2 = sy;
          const segs = Math.floor(p * 8) + 1;
          for (let k = 0; k < segs; k++) {
            px2 += 20 + rc() * 50;
            py2 += (rc() - 0.5) * 34;
            ctx.lineTo(px2, py2);
          }
          ctx.stroke();
          // odbočka
          if (segs > 4) {
            ctx.beginPath();
            ctx.moveTo(sx + 80, sy + 4);
            ctx.lineTo(sx + 110 + rc() * 30, sy - 26 - rc() * 14);
            ctx.stroke();
          }
        }
      }

      /* mihotání nezamrzlého očka tůňky */
      sparkleDyn(ctx, t, 10302, 6, 2176, 862, 100, 20, '224,232,240');

      /* MLHA — tři pásy různých rychlostí (hlavní kouzlo scény) */
      for (let i = 0; i < 3; i++) {
        const sp = 8 + i * 7;
        const alpha = 0.11 + i * 0.045;
        const yy = 640 + i * 130;
        const n = 6;
        for (let k = 0; k < n; k++) {
          const span = SW + 1000;
          const mx = ((k * span / n + t * sp + i * 400) % span) - 500;
          const my = yy + Math.sin(t * 0.14 + k * 2.1 + i * 2.6) * 22;
          mistPuff(ctx, mx, my, 300 + k * 36, 46 + i * 14, '196,206,212', alpha);
        }
      }

      /* jemné sněžení */
      snowDyn(ctx, t, SW, 10401, 60, 6, '#dfe6ee');
    },
    overlayDynamic(ctx, t, camX) {
      ctx.save();
      ctx.translate(camX || 0, 0); // screen-space efekty
      // hustý přízemní pás mlhy vpředu
      for (let k = 0; k < 5; k++) {
        const mx = ((k * 540 + t * 16) % (W + 1100)) - 550;
        mistPuff(ctx, mx, 1046 + Math.sin(t * 0.3 + k * 1.8) * 12, 360, 60, '200,210,216', 0.16);
      }
      // občas přeletí přes celou scénu mlžný závoj
      {
        const per = 47, ph = t % per;
        if (ph < 12) {
          const p = ph / 12;
          mistPuff(ctx, lerp(-500, W + 500, p), 500 + Math.sin(p * 5) * 60, 520, 160, '206,214,220', 0.13 * Math.sin(p * Math.PI));
        }
      }
      // šedá vinětace — svírá scénu
      const vg = ctx.createRadialGradient(W / 2, H * 0.46, 360, W / 2, H * 0.5, 1250);
      vg.addColorStop(0, 'rgba(14,20,26,0)');
      vg.addColorStop(1, 'rgba(14,20,26,0.44)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    },
    walkArea: [[190, 890], [850, 890], [900, 940], [1580, 940], [1640, 890], [2380, 880], [2420, 930], [2380, 1000], [1700, 1010], [900, 1030], [400, 1010], [180, 980]],
    scaleAt(y) { return clamp(0.54 + 0.52 * (y - 850) / 190, 0.48, 1.08); },
    exits: [
      { to: 'old_town', at: [190, 930], spawn: [2280, 940], label: { cz: 'Po hatích do Starých Benátek', en: 'Along the causeway to Old Benátky' } }
    ]
  });
})();

})();

</script>
<script>
/* =========================================================================

/* =============================================================== nastavení */
function quality() {
  const s = BNJ.settings;

/* ================================================================ sprity */
let SP = null;
function sprites() {
  if (SP) return SP;
  SP = {};
  // měkká vločka (bokeh)
  const f = mk(64, 64), fx = f.getContext('2d');
  const g = fx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.75)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  fx.fillStyle = g; fx.fillRect(0, 0, 64, 64);
  SP.flake = f;

  const s = mk(48, 48), sx = s.getContext('2d');
  sx.translate(24, 24);
  const sg = sx.createRadialGradient(0, 0, 0, 0, 0, 8);
  sg.addColorStop(0, 'rgba(255,255,255,1)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  sx.fillStyle = sg; sx.beginPath(); sx.arc(0, 0, 8, 0, TAU); sx.fill();
  sx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 2; i++) {
    sx.save(); sx.rotate(i * Math.PI / 2);
    sx.beginPath(); sx.moveTo(-22, 0); sx.quadraticCurveTo(0, -1.6, 22, 0); sx.quadraticCurveTo(0, 1.6, -22, 0); sx.fill();
    sx.restore();
  }
  SP.glint = s;
  // jiskra
  const e = mk(24, 24), ex = e.getContext('2d');
  const eg = ex.createRadialGradient(12, 12, 0, 12, 12, 12);
  eg.addColorStop(0, 'rgba(255,240,190,1)'); eg.addColorStop(0.3, 'rgba(255,170,70,0.85)'); eg.addColorStop(1, 'rgba(255,90,20,0)');
  ex.fillStyle = eg; ex.fillRect(0, 0, 24, 24);
  SP.ember = e;
  // mlha — horizontálně dlaždicová textura z měkkých obláčků
  const fw = 1024, fh = 256, fog = mk(fw, fh), fgx = fog.getContext('2d');
  const rng = mulberry(4242);
  for (let i = 0; i < 150; i++) {
    const x = rng() * fw, y = fh * (0.3 + rng() * 0.4), r = 40 + rng() * 110, a = 0.05 + rng() * 0.09;
    for (const ox of [-fw, 0, fw]) {
      const gg = fgx.createRadialGradient(x + ox, y, 0, x + ox, y, r);
      gg.addColorStop(0, 'rgba(255,255,255,' + a + ')'); gg.addColorStop(1, 'rgba(255,255,255,0)');

  vg.addColorStop(0.65, 'rgba(0,0,0,1)'); vg.addColorStop(1, 'rgba(0,0,0,0)');

    const id = gx.createImageData(256, 256), d = id.data, r2 = mulberry(77 + k);
    for (let i = 0; i < d.length; i += 4) {

    }
    gx.putImageData(id, 0, 0);
    SP.grain.push(gc);
  }
  SP.grainPat = null;

  SP.b1 = mk(480, 270); SP.b2 = mk(240, 135); SP.b3 = mk(120, 68);

}

function fogTint(c) {
  const sp = sprites();
  if (sp.fogTint[c]) return sp.fogTint[c];
  const t = mk(sp.fog.width, sp.fog.height), x = t.getContext('2d');
  x.drawImage(sp.fog, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = 'rgb(' + c + ')'; x.fillRect(0, 0, t.width, t.height);
  sp.fogTint[c] = t;
  return t;
}

/* ===================================================== autozáře vrstvy */
function buildGlow(src, cfg) {
  const sw = src.width, sh = src.height;
  const w2 = Math.ceil(sw / 2), h2 = Math.ceil(sh / 2);
  const c2 = mk(w2, h2), x2 = c2.getContext('2d');
  x2.drawImage(src, 0, 0, w2, h2);
  let id;
  try { id = x2.getImageData(0, 0, w2, h2); } catch (e) { return null; }
  const d = id.data;
  const warm0 = cfg.warm, v0 = cfg.v;
  let any = 0;
  for (let i = 0; i < d.length; i += 4) {
    const a = d[i + 3];
    if (a < 8) { d[i + 3] = 0; continue; }
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const v = r > g ? (r > b ? r : b) : (g > b ? g : b);
    let wt = smooth(warm0, warm0 + 70, r - b) * smooth(v0, 252, v) * smooth(0.5, 0.72, g / (r + 1));
    if (wt < 0.02) { d[i + 3] = 0; continue; }
    any++;
    d[i + 3] = Math.min(255, wt * a);
  }
  if (any < 4) return null;
  x2.putImageData(id, 0, 0);
  // rozmazání řetězem zmenšenin
  const c4 = mk(w2 / 2, h2 / 2), c8 = mk(w2 / 4, h2 / 4), c16 = mk(w2 / 8, h2 / 8), c32 = mk(w2 / 16, h2 / 16);
  c4.getContext('2d').drawImage(c2, 0, 0, c4.width, c4.height);
  c8.getContext('2d').drawImage(c4, 0, 0, c8.width, c8.height);
  c16.getContext('2d').drawImage(c8, 0, 0, c16.width, c16.height);
  c32.getContext('2d').drawImage(c16, 0, 0, c32.width, c32.height);
  // těsná záře (1/4) a široká (1/8 složená z 1/8+1/16+1/32)
  const tight = mk(c4.width, c4.height), tx = tight.getContext('2d');
  tx.drawImage(c4, 0, 0);
  tx.globalCompositeOperation = 'lighter';
  tx.drawImage(c8, 0, 0, tight.width, tight.height);
  const wide = mk(c8.width, c8.height), wx = wide.getContext('2d');
  wx.globalCompositeOperation = 'lighter';
  wx.globalAlpha = 0.9; wx.drawImage(c8, 0, 0);
  wx.globalAlpha = 1; wx.drawImage(c16, 0, 0, wide.width, wide.height);
  wx.drawImage(c32, 0, 0, wide.width, wide.height);
  wx.drawImage(c32, 0, 0, wide.width, wide.height);
  // ozáření pro postavy (CPU kopie 1/32)
  let irr = null;
  try {
    const big = mk(c32.width, c32.height), bx = big.getContext('2d');
    bx.drawImage(c32, 0, 0);
    bx.globalCompositeOperation = 'lighter';
    bx.drawImage(c16, 0, 0, big.width, big.height);
    irr = { w: big.width, h: big.height, d: bx.getImageData(0, 0, big.width, big.height).data, s: sw / big.width };
  } catch (e) { irr = null; }
  return { tight, wide, irr, k: cfg.k || 1 };
}

function layerIndexBefore(def, idx) { return idx; }

BNJ.fx = {};
const FX = BNJ.fx;
FX.quality = quality;

FX.prepare = function (def) {
  if (def._fx) return;
  const prof = P[def.id] || {};
  const fx = def._fx = { prof, glints: [] };
  if (prof.glow && def._pre) {
    const t0 = performance.now();
    for (const L of def._pre) {
      try { L.glow = buildGlow(L.c, prof.glow); } catch (e) { L.glow = null; }
    }
    fx.buildMs = performance.now() - t0;
  }
  // třpyt na sněhu — pevné pozice v pochozím pásu (vrstva p=1)
  if (prof.glints) {
    const rng = mulberry(def.id.length * 977 + 13);
    const wa = def.walkArea || [[0, 860], [def.width, 1080]];
    let top = 1080; for (const p of wa) top = Math.min(top, p[1]);
    for (let i = 0; i < prof.glints.n; i++) {
      fx.glints.push({ x: rng() * def.width, y: top - 10 + rng() * (H - top + 10), ph: rng() * TAU, sp: 0.5 + rng() * 1.2, s: 0.35 + rng() * 0.6 });
    }
  }
  // vločky — deterministické parametry
  if (prof.snow) {
    const rng = mulberry(91 + def.id.length);
    fx.flakes = [];
    for (let i = 0; i < prof.snow.n; i++) {
      fx.flakes.push({ x: rng() * (W + 200), y: rng() * (H + 200), vy: 50 + rng() * 90, sz: 10 + rng() * 26, a: 0.25 + rng() * 0.45, ph: rng() * TAU, f: 0.4 + rng() * 0.9, d: 1.25 + rng() * 0.7 });
    }
  }
  if (prof.motes) {
    const rng = mulberry(555);
    fx.motes = [];
    for (let i = 0; i < prof.motes.n; i++) fx.motes.push({ x: rng(), y: rng(), ph: rng() * TAU, sp: 0.02 + rng() * 0.05, s: 0.6 + rng() * 1.8 });
  }
};

/* ================================================================ kreslení */
function drawLayerGlow(ctx, L, camX, a, t) {
  const g = L.glow;
  if (!g) return;
  const x0 = -camX * L.p;
  const k = g.k * a * (0.94 + 0.06 * Math.sin(t * 1.7));
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = clamp(k * 0.32, 0, 1);
  ctx.drawImage(g.tight, x0, 0, L.c.width, L.c.height);
  ctx.globalAlpha = clamp(k * 0.7, 0, 1);
  ctx.drawImage(g.wide, x0, 0, L.c.width, L.c.height);
  ctx.restore();
}

function drawFog(ctx, f, camX, t, layerP) {
  const tex = fogTint(f.c);
  const sc = (f.scale || 1) * (f.h / 128);
  const tw = tex.width * sc, th = tex.height * sc;
  let ox = -((camX * layerP + t * (f.sp || 0)) % tw);
  if (ox > 0) ox -= tw;
  ctx.save();
  ctx.globalAlpha = f.a * (0.85 + 0.15 * Math.sin(t * 0.21 + f.y));
  for (let x = ox; x < W; x += tw) ctx.drawImage(tex, x, f.y - th / 2, tw, th);
  ctx.restore();
}

function lightScreenX(l, camX) { return l.x - camX * (l.p != null ? l.p : 1); }

function drawLights(ctx, prof, camX, t) {
  if (!prof.lights) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of prof.lights) {
    const sx = lightScreenX(l, camX), sy = l.y;
    if (sx < -l.r * 1.2 || sx > W + l.r * 1.2) continue;
    const fl = l.flick ? flick(t, l.flick * 3.1) : 1;
    const a = l.a * fl;
    const r = l.r * (l.flick ? 0.94 + 0.08 * fl : 1);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0, 'rgba(' + l.c + ',' + (a * 0.9).toFixed(3) + ')');
    g.addColorStop(0.18, 'rgba(' + l.c + ',' + (a * 0.42).toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(' + l.c + ',' + (a * 0.12).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + l.c + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    // kužel světla na sněhu / podlaze
    if (l.pool) {
      ctx.save();
      ctx.translate(sx, sy + 40);
      ctx.scale(1, 0.24);
      const pr = r * 1.15;
      const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, pr);
      pg.addColorStop(0, 'rgba(' + l.c + ',' + (l.pool * fl * 0.5).toFixed(3) + ')');
      pg.addColorStop(0.45, 'rgba(' + l.c + ',' + (l.pool * fl * 0.16).toFixed(3) + ')');
      pg.addColorStop(1, 'rgba(' + l.c + ',0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(0, 0, pr, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawRays(ctx, prof, camX, t) {
  if (!prof.rays) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  prof.rays.forEach((r, i) => {
    const ox = r.x - camX * (r.p != null ? r.p : 1), oy = r.y;
    const dx = Math.cos(r.ang), dy = Math.sin(r.ang);
    const nx = -dy, ny = dx;
    const ex = ox + dx * r.len, ey = oy + dy * r.len;
    const a = r.a * (0.7 + 0.3 * Math.sin(t * 0.23 + i * 1.7)) * (0.85 + 0.15 * Math.sin(t * 0.61 + i));
    const g = ctx.createLinearGradient(ox, oy, ex, ey);
    g.addColorStop(0, 'rgba(' + r.c + ',' + a.toFixed(3) + ')');
    g.addColorStop(0.55, 'rgba(' + r.c + ',' + (a * 0.45).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + r.c + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(ox + nx * r.w0 / 2, oy + ny * r.w0 / 2);
    ctx.lineTo(ex + nx * r.w1 / 2, ey + ny * r.w1 / 2);
    ctx.lineTo(ex - nx * r.w1 / 2, ey - ny * r.w1 / 2);
    ctx.lineTo(ox - nx * r.w0 / 2, oy - ny * r.w0 / 2);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

function drawEmbers(ctx, prof, camX, t) {
  if (!prof.lights) return;
  const sp = sprites();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of prof.lights) {
    if (!l.embers) continue;
    const sx = lightScreenX(l, camX);
    if (sx < -200 || sx > W + 200) continue;
    for (let i = 0; i < l.embers; i++) {
      const seed = i * 12.9898 + l.x;
      const per = 2.2 + (Math.sin(seed) * 0.5 + 0.5) * 1.8;
      const life = ((t / per) + (Math.sin(seed * 3.1) * 0.5 + 0.5)) % 1;
      const drift = Math.sin(seed * 7.7) * 60;
      const x = sx + Math.sin(life * 5 + seed) * 18 * life + drift * life;
      const y = l.y - 10 - life * (180 + (i % 5) * 40);
      const a = (1 - life) * (life < 0.1 ? life * 10 : 1);
      const s = (3 + (i % 3) * 2) * (1 - life * 0.6);
      ctx.globalAlpha = a * 0.9;
      ctx.drawImage(sp.ember, x - s, y - s, s * 2, s * 2);
    }
  }
  ctx.restore();
}

function drawMotes(ctx, def, camX, t) {
  const m = def._fx.prof.motes, arr = def._fx.motes;
  if (!m || !arr) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of arr) {
    const u = (p.x + Math.sin(t * p.sp * 6 + p.ph) * 0.04 + t * p.sp * 0.3) % 1;
    const v = (p.y + t * p.sp * 0.5 + Math.cos(t * p.sp * 5 + p.ph) * 0.03) % 1;
    const x = m.x + u * m.w + v * m.w * 0.25 - camX, y = m.y + v * m.h;
    const tw = 0.5 + 0.5 * Math.sin(t * 2 + p.ph * 3);
    ctx.globalAlpha = 0.25 + tw * 0.55;
    ctx.fillStyle = 'rgb(' + m.c + ')';
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFlakes(ctx, def, camX, t) {
  const prof = def._fx.prof, arr = def._fx.flakes;
  if (!prof.snow || !arr) return;
  const sp = sprites();
  const wind = prof.snow.wind * (1 + 0.6 * Math.sin(t * 0.17)) + 50 * Math.max(0, Math.sin(t * 0.09) - 0.7) * 3;
  ctx.save();
  for (const f of arr) {
    const span = W + 200, spanY = H + 200;
    let x = (f.x + wind * t * f.d + Math.sin(t * f.f + f.ph) * 30 - camX * f.d) % span;
    if (x < 0) x += span;
    const y = (f.y + f.vy * t * f.d * 0.6) % spanY;
    ctx.globalAlpha = f.a * (f.d > 1.7 ? 0.7 : 1);
    const s = f.sz * f.d * 0.6;
    ctx.drawImage(sp.flake, x - 100 - s / 2, y - 100 - s / 2, s, s);
  }
  ctx.restore();
}

FX.ground = function (ctx, def, camX, t) {
  if (!def._fx || quality() < 1) return;
  const prof = def._fx.prof;
  if (!prof.glints) return;
  const sp = sprites();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ga = prof.glints.a;
  for (const g of def._fx.glints) {
    const x = g.x - camX;
    if (x < -20 || x > W + 20) continue;
    // třpyt závisí i na pozici kamery (úhel pohledu) — jiskří při chůzi
    const ph = Math.sin(t * g.sp + g.ph + camX * 0.004 + g.x * 0.01);
    const k = Math.pow(Math.max(0, ph), 18);
    if (k < 0.04) continue;
    const s = 22 * g.s * (0.6 + k * 0.6);
    ctx.globalAlpha = k * ga;
    ctx.drawImage(sp.glint, x - s / 2, g.y - s / 2, s, s);
  }
  ctx.restore();
};

FX.afterLayer = function (ctx, def, i, camX, t) {
  if (!def._fx || quality() < 1) return;
  const L = def._pre[i];
  if (L && L.glow) drawLayerGlow(ctx, L, camX, 1, t);
  const prof = def._fx.prof;
  if (prof.fog) for (const f of prof.fog) if (f.after === i) drawFog(ctx, f, camX, t, L ? L.p : 1);
};

function bloom(ctx, amt) {
  const sp = sprites();
  const b1 = sp.b1, b2 = sp.b2, b3 = sp.b3;
  const x1 = b1.getContext('2d'), x2 = b2.getContext('2d'), x3 = b3.getContext('2d');
  x1.globalCompositeOperation = 'copy';
  x1.drawImage(ctx.canvas, 0, 0, b1.width, b1.height);
  // měkký práh: x² · x²  → zůstanou jen světla
  x1.globalCompositeOperation = 'multiply';
  x1.drawImage(b1, 0, 0);
  x1.drawImage(b1, 0, 0);
  x2.globalCompositeOperation = 'copy'; x2.drawImage(b1, 0, 0, b2.width, b2.height);
  x3.globalCompositeOperation = 'copy'; x3.drawImage(b2, 0, 0, b3.width, b3.height);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = amt * 0.6; ctx.drawImage(b2, 0, 0, W, H);
  ctx.globalAlpha = amt; ctx.drawImage(b3, 0, 0, W, H);
  ctx.restore();
}

function grade(ctx, g) {
  if (!g) return;
  ctx.save();
  if (g.top || g.bot) {
    ctx.globalCompositeOperation = 'soft-light';
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, 'rgba(' + (g.top || '128,128,128') + ',' + (g.topA || 0) + ')');
    gr.addColorStop(0.5, 'rgba(128,128,128,0)');
    gr.addColorStop(1, 'rgba(' + (g.bot || '128,128,128') + ',' + (g.botA || 0) + ')');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }
  if (g.lift) {
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = 'rgba(' + g.lift + ',' + (g.liftA || 0.05) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

const _vigCache = {};
function vignette(ctx, a, c) {
  const key = a + '|' + c;
  let v = _vigCache[key];
  if (!v) {
    v = mk(480, 270);
    const x = v.getContext('2d');
    const g = x.createRadialGradient(240, 125, 60, 240, 135, 300);
    g.addColorStop(0, 'rgba(' + c + ',0)');
    g.addColorStop(0.55, 'rgba(' + c + ',' + (a * 0.25) + ')');
    g.addColorStop(1, 'rgba(' + c + ',' + a + ')');
    x.fillStyle = g; x.fillRect(0, 0, 480, 270);
    _vigCache[key] = v;
  }
  ctx.drawImage(v, 0, 0, W, H);
}

let _gf = 0;
function grain(ctx, a) {
  const sp = sprites();
  _gf++;
  const tile = sp.grain[(_gf >> 1) & 3];
  const pat = ctx.createPattern(tile, 'repeat');
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = a;
  ctx.translate((_gf * 37) % 256, (_gf * 71) % 256);
  ctx.fillStyle = pat;
  ctx.fillRect(-256, -256, W + 256, H + 256);
  ctx.restore();
}

FX.post = function (ctx, def, camX, t) {
  if (!def._fx) return;
  const q = quality();
  const prof = def._fx.prof;
  if (q >= 1) {
    if (prof.fog) for (const f of prof.fog) if (f.after == null) drawFog(ctx, f, camX, t, 1);
    drawLights(ctx, prof, camX, t);
    if (q >= 2) drawRays(ctx, prof, camX, t);
    drawEmbers(ctx, prof, camX, t);
    if (q >= 2) drawMotes(ctx, def, camX, t);
    drawFlakes(ctx, def, camX, t);
    if (q >= 2 && prof.bloom) bloom(ctx, prof.bloom);
    grade(ctx, prof.grade);
  }
  if (prof.vignette) vignette(ctx, prof.vignette, prof.vig || '0,0,0');
  if (q >= 2 && prof.grain) grain(ctx, prof.grain);
};

/* efekty pro titulku a obrazovky mimo scény */
FX.screenFx = function (ctx, t, id) {
  const prof = P[id || 'title'];
  if (!prof) return;
  const q = quality();
  if (q >= 2 && prof.bloom) bloom(ctx, prof.bloom);
  if (q >= 1) grade(ctx, prof.grade);
  if (prof.vignette) vignette(ctx, prof.vignette, prof.vig || '0,0,0');
  if (q >= 2 && prof.grain) grain(ctx, prof.grain);
};

/* ===================================================== světlo na postavy */
FX.actorLight = function (def, x, y, h, camX, t) {
  if (!def || !def._fx || quality() < 1) return null;
  const prof = def._fx.prof;
  let r = 0, g = 0, b = 0, k = 0;
  const ty = y - h * 0.5;
  for (const L of def._pre || []) {
    const ir = L.glow && L.glow.irr;
    if (!ir) continue;
    const lx = x - camX * (1 - L.p);
    const px = clamp((lx / ir.s) | 0, 0, ir.w - 1), py = clamp((ty / ir.s) | 0, 0, ir.h - 1);
    const i = (py * ir.w + px) * 4;
    const a = ir.d[i + 3] / 255 * L.glow.k;
    r += ir.d[i] * a; g += ir.d[i + 1] * a; b += ir.d[i + 2] * a; k += a;
  }
  if (prof.lights) {
    for (const l of prof.lights) {
      if (l.sun) continue;
      const lx = l.x - camX * ((l.p != null ? l.p : 1) - 1);
      const d = Math.hypot(lx - x, (l.y - ty) * 1.4);
      if (d > l.r * 1.3) continue;
      const fl = l.flick ? flick(t, l.flick * 3.1) : 1;
      const a = l.a * fl * Math.pow(1 - d / (l.r * 1.3), 2) * 1.6;
      const c = l.c.split(',');
      r += +c[0] * a; g += +c[1] * a; b += +c[2] * a; k += a;
    }
  }
  if (k < 0.01) return null;
  return { c: Math.round(r / k) + ',' + Math.round(g / k) + ',' + Math.round(b / k), k: clamp(k * 0.5, 0, 0.5), side: side(prof, x, ty, camX) };
};

/* odkud přichází nejsilnější lokální světlo: −1 zleva, +1 zprava, 0 shora */
function side(prof, x, y, camX) {
  let best = 0, bw = 0;
  for (const l of prof.lights || []) {
    const lx = l.x - camX * ((l.p != null ? l.p : 1) - 1);
    const d = Math.hypot(lx - x, l.y - y);
    const w = l.sun ? l.a * 0.6 : l.a * Math.max(0, 1 - d / (l.r * 1.3));
    if (w > bw) { bw = w; best = clamp((lx - x) / 300, -1, 1); }
  }
  return best;
}

FX.actorShadow = function (def, x, y, t) {
  if (!def || !def._fx || quality() < 2) return null;
  const prof = def._fx.prof, s = prof.shadow;
  if (!s) return null;
  if (!s.point) return { vx: s.vx, vy: s.vy, a: s.a, c: s.c || '20,20,40' };
  let best = null, bw = 0;
  for (const l of prof.lights || []) {
    if (!l.shadow) continue;
    const d = Math.hypot(l.x - x, (l.y - y) * 1.6);
    const w = l.a * Math.max(0, 1 - d / (l.r * 2.2));
    if (w > bw) { bw = w; best = l; }
  }
  if (!best || bw < 0.02) return null;
  const dx = x - best.x;
  const fl = best.flick ? flick(t, best.flick * 3.1) : 1;
  const len = clamp(Math.abs(dx) / 260, 0.35, 1.25);
  return {
    vx: Math.sign(dx || 1) * len,
    vy: clamp((y - best.y) / 260, -0.25, 0.35) + 0.08,
    a: s.a * clamp(bw * 2.2, 0.3, 1) * (0.85 + 0.15 * fl),
    c: s.c || '10,8,30'
  };
};

})();

</script>
<script>
/* =========================================================================
   ZTRACENÝ LIST — 30_characters.js
   Postavy: vektorové karikatury à la Curse of Monkey Island.
   Výrazné siluety, velké hlavy a ruce, osobité proporce.

   Kánon (IDS.md): jirka, brahe, kepler, benda, prevoznik, trhovkyne.
   API (CONTRACT.md): BNJ.registerCharacter({id, textColor, height, draw})
   draw(ctx, pose) — kotva = střed nohou (0,0), osa Y nahoru záporná.
   pose = { t, dir:1|-1, action:'idle'|'walk'|'talk'|'reach'|'pickup',
            mouth:0..1, blink:0..1, phase:0..1 }

   Animace: walk cycle kvantovaný do 8 fází (nohy, ruce, poskok, brašna),
   idle (dýchání, mrkání, občasné gesto), talk (ústa dle pose.mouth, gesta,
   obočí), reach/pickup (natažení / dřep). Sekundární pohyb: šála, vlasy,
   péro na čapce, pláštík, kouř z fajfky. Flip směru řeší postava sama
   (ctx.scale(pose.dir,1)); lightTint scény aplikuje engine nad kresbou.
   ========================================================================= */
(function () {
'use strict';

const BNJ = window.BNJ;
if (!BNJ || !BNJ.registerCharacter) {
  console.error('[30_characters] BNJ.registerCharacter chybí — načtěte 00_engine.js dřív.');
  return;
}

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const mix = (a, b, k) => a + (b - a) * k;
/* hladký "kopeček" 0→1→0 pro občasná gesta */
const bump = (x) => (x <= 0 || x >= 1) ? 0 : Math.sin(Math.PI * x);

/* společné barvy pleti */
const SKIN = '#eab98c';
const SKIN_HI = '#f6d3ab';
const INK = 'rgba(32,16,9,0.92)';        // výrazná tmavá kontura (CoMI)
const TONE_D = 'rgba(30,22,58,0.26)';    // stínový cel-tón (modrofialový)
const TONE_L = 'rgba(255,240,205,0.14)'; // osvětlený cel-tón
const EYE_D = '#2a1a10';
/* směr světla (odkud svítí): nízké zimní slunce / okna vlevo nahoře.
   CLX = LX kompenzované o flip postavy (ctx.scale(dir,1)), aby světlo
   zůstalo ve SVĚTOVÝCH souřadnicích — rim se neotáčí s postavou. */
const LX = -0.62, LY = -0.78;
let CLX = LX;

/* ---------------------------------------------------- rim-light dle scény
   Engine přebarvuje postavu scene.lightTint (source-atop); tady si z téže
   hodnoty (přes registr, čtení jen — API se nemění) odvodíme BARVU okraje
   po siluetě. Scény s lokálním teplým zdrojem (oheň v koších, svíčky) mají
   ruční override — Jirka u ohně v old_town MUSÍ mít teplý okraj. */
const RIM_OVERRIDE = {
  old_town:    ['rgba(255,186,104,1)', 'rgba(255,186,104,0.60)'],    // ohně + okna
  observatory: ['rgba(255,212,146,1)', 'rgba(255,212,146,0.55)'],    // svíčky
  square:      ['rgba(255,228,184,0.9)', 'rgba(255,228,184,0.42)'],  // nízké slunce
};
const RIM_DEF = ['rgba(210,232,255,0.95)', 'rgba(210,232,255,0.45)'];
let RIM = RIM_DEF[0];        // hlavní rim (kontury cel-shadingu)
let RIM_SOFT = RIM_DEF[1];   // slabší rim (končetiny)
function sceneRim() {
  const id = BNJ.state && BNJ.state.scene;
  const o = id && RIM_OVERRIDE[id];
  if (o) { RIM = o[0]; RIM_SOFT = o[1]; return; }
  const sc = id && BNJ._registry && BNJ._registry.scenes && BNJ._registry.scenes[id];
  const m = sc && sc.lightTint &&
    /rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/.exec(sc.lightTint);
  if (m) {
    /* zesvětlit tint směrem k bílé → okrajové světlo v barvě scény */
    const L = (v) => Math.round(mix(+v, 255, 0.55));
    RIM = 'rgba(' + L(m[1]) + ',' + L(m[2]) + ',' + L(m[3]) + ',0.88)';
    RIM_SOFT = 'rgba(' + L(m[1]) + ',' + L(m[2]) + ',' + L(m[3]) + ',0.40)';
  } else { RIM = RIM_DEF[0]; RIM_SOFT = RIM_DEF[1]; }
}

/* ------------------------------------------------------------- pomocníci */
function ell(ctx, x, y, rx, ry, col, rot) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fill();
}

function shadow(ctx, rx) {
  ell(ctx, 0, -4, rx, rx * 0.22, 'rgba(10,14,26,0.28)');
}

/* půlrovina: bod (px,py), vnější normála (nx,ny), rozměr S — pro clipy tónů */
function hp(ctx, px, py, nx, ny, S) {
  const tx = -ny, ty = nx;
  ctx.moveTo(px + tx * S, py + ty * S);
  ctx.lineTo(px - tx * S, py - ty * S);
  ctx.lineTo(px - tx * S + nx * S, py - ty * S + ny * S);
  ctx.lineTo(px + tx * S + nx * S, py + ty * S + ny * S);
  ctx.closePath();
}

/* Cel-shading à la CoMI: výplň + stínový tón na odvrácené straně + světlý
   tón po směru světla + rim-light po kontuře + inkoustová kontura, která na
   stinné straně zesílí (proměnlivá tloušťka linky).
   path = fn(c) vykreslí tvar; o = {base, cx, cy, r, lw, dark, light, rim, rimW, ink}
   (dark/light/rim: null = vynechat, undefined = výchozí tóny) */
function cel(ctx, path, o) {
  const cx = o.cx || 0, cy = o.cy || 0, R = o.r || 50, S = R * 4;
  ctx.save();
  ctx.beginPath(); path(ctx);
  if (o.base) { ctx.fillStyle = o.base; ctx.fill(); }
  ctx.clip();
  if (o.dark !== null) {
    ctx.fillStyle = o.dark || TONE_D;
    ctx.beginPath(); hp(ctx, cx - CLX * R * 0.30, cy - LY * R * 0.30, -CLX, -LY, S); ctx.fill();
  }
  if (o.light !== null) {
    ctx.fillStyle = o.light || TONE_L;
    ctx.beginPath(); hp(ctx, cx + CLX * R * 0.45, cy + LY * R * 0.45, CLX, LY, S); ctx.fill();
  }
  ctx.restore();
  const lw = o.lw || 3;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.beginPath(); path(ctx);
  ctx.strokeStyle = o.ink || INK; ctx.lineWidth = lw; ctx.stroke();
  ctx.beginPath(); hp(ctx, cx - CLX * R * 0.05, cy - LY * R * 0.05, -CLX, -LY, S); ctx.clip();
  ctx.beginPath(); path(ctx);
  ctx.lineWidth = lw * 1.9; ctx.stroke();
  ctx.restore();
  /* rim-light AŽ NAVRCH (přes inkoust), oříznutý dovnitř siluety —
     jasná světlá hrana po návětrné straně à la CoMI */
  if (o.rim !== null) {
    ctx.save();
    ctx.beginPath(); path(ctx); ctx.clip();
    ctx.beginPath(); hp(ctx, cx + CLX * R * 0.28, cy + LY * R * 0.28, CLX, LY, S); ctx.clip();
    ctx.beginPath(); path(ctx);
    ctx.strokeStyle = o.rim || RIM; ctx.lineWidth = o.rimW || 10; ctx.stroke();
    ctx.restore();
  }
}

/* rim-light po kontuře libovolného tvaru (čepice, šátky — velké masy
   siluety, které nejdou přes cel()) — jen na návětrné straně */
function rimStroke(ctx, path, cx, cy, r, w) {
  const S = (r || 40) * 4;
  ctx.save();
  ctx.beginPath(); path(ctx); ctx.clip();          // jen dovnitř siluety
  ctx.beginPath(); hp(ctx, cx + CLX * r * 0.25, cy + LY * r * 0.25, CLX, LY, S); ctx.clip();
  ctx.beginPath(); path(ctx);
  ctx.strokeStyle = RIM; ctx.lineWidth = (w || 8) * 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

/* karikaturní hlava: kulaté temeno, tvář a brada vystrčené dopředu (+x).
   chin: 0 = měkce kulatá, ~1.4 = ostrá vystrčená brada */
function headRound(hx, hy, rx, ry, chin) {
  const ch = chin || 0;
  return function (c) {
    c.moveTo(hx - rx, hy + ry * 0.08);
    c.quadraticCurveTo(hx - rx * 1.04, hy - ry * 0.86, hx - rx * 0.3, hy - ry * 0.99);
    c.quadraticCurveTo(hx + rx * 0.42, hy - ry * 1.08, hx + rx * 0.88, hy - ry * 0.52);
    c.quadraticCurveTo(hx + rx * 1.06, hy - ry * 0.1, hx + rx * 0.98, hy + ry * 0.3);
    c.quadraticCurveTo(hx + rx * (0.98 + ch * 0.08), hy + ry * (0.5 + ch * 0.1),
      hx + rx * (0.6 + ch * 0.12), hy + ry * (0.68 + ch * 0.16));
    c.quadraticCurveTo(hx + rx * 0.25, hy + ry * (0.92 + ch * 0.08), hx - rx * 0.2, hy + ry * 0.88);
    c.quadraticCurveTo(hx - rx * 0.85, hy + ry * 0.72, hx - rx, hy + ry * 0.08);
    c.closePath();
  };
}

/* dvoudílná končetina: rameno/kyčel → (ohyb) → dlaň/chodidlo.
   Inkoustový podklad = kontura kolem celé končetiny, stínový tón po
   odvrácené straně, tenký rim po návětrné. */
function limb(ctx, x0, y0, bx, by, x1, y1, w, col) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = w + 5;               // kontura
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(bx, by, x1, y1); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w;                   // jádro
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(bx, by, x1, y1); ctx.stroke();
  const dx = -CLX * w * 0.28, dy = -LY * w * 0.28;             // stínový tón
  ctx.strokeStyle = TONE_D; ctx.lineWidth = w * 0.5;
  ctx.beginPath(); ctx.moveTo(x0 + dx, y0 + dy);
  ctx.quadraticCurveTo(bx + dx * 1.4, by + dy * 1.4, x1 + dx, y1 + dy); ctx.stroke();
  ctx.strokeStyle = RIM_SOFT; ctx.lineWidth = Math.max(2, w * 0.26);
  ctx.beginPath(); ctx.moveTo(x0 - dx, y0 - dy);              // rim dle světla scény
  ctx.quadraticCurveTo(bx - dx * 1.3, by - dy * 1.3, x1 - dx, y1 - dy); ctx.stroke();
}

/* velká karikaturní dlaň s palcem (CoMI ruce!) — zvětšeno o dalších ~30 % */
function hand(ctx, x, y, r, col) {
  const R = r * 1.75;
  cel(ctx, (c) => { c.ellipse(x - R * 0.54, y - R * 0.5, R * 0.48, R * 0.38, -0.7, 0, TAU); },
    { base: col, cx: x - R * 0.5, cy: y - R * 0.5, r: R * 0.5, lw: 2.2, rim: null });
  cel(ctx, (c) => { c.ellipse(x, y, R, R * 0.9, -0.25, 0, TAU); },
    { base: col, cx: x, cy: y, r: R, lw: 2.8 });
}

/* holá pracovní ruka s PRSTY (žádný palčákový bochánek) — dlaň, palec a
   tři buclaté prsty vějířem ve směru ang. Pro postavy bez rukavic. */
function handBare(ctx, x, y, r, ang) {
  const R = r * 1.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang || 0);
  /* palec — odstátý proti prstům */
  cel(ctx, (c) => { c.ellipse(-R * 0.42, -R * 0.5, R * 0.44, R * 0.28, -0.85, 0, TAU); },
    { base: SKIN, cx: -R * 0.42, cy: -R * 0.5, r: R * 0.4, lw: 2, rim: null });
  /* tři prsty vějířem (kreslené PŘED dlaní, ať z ní vyrůstají) */
  for (let i = 0; i < 3; i++) {
    const a = -0.46 + i * 0.46;
    const fx = Math.cos(a) * R * 0.88, fy = Math.sin(a) * R * 0.88;
    cel(ctx, (c) => { c.ellipse(fx, fy, R * 0.42, R * 0.21, a, 0, TAU); },
      { base: SKIN, cx: fx, cy: fy, r: R * 0.35, lw: 1.9, rim: null });
  }
  /* dlaň navrch */
  cel(ctx, (c) => { c.ellipse(0, 0, R * 0.74, R * 0.66, -0.18, 0, TAU); },
    { base: SKIN, cx: 0, cy: 0, r: R * 0.7, lw: 2.3 });
  /* klouby — dvě tečky */
  ctx.fillStyle = 'rgba(150,84,48,0.35)';
  ctx.beginPath(); ctx.arc(R * 0.3, -R * 0.2, 1.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(R * 0.42, R * 0.12, 1.6, 0, TAU); ctx.fill();
  ctx.restore();
}

/* bota — OBŘÍ fazetovaná bagančata à la CoMI: rovné seky, zvednutá špička,
   podpatek. y ~ střed boty, spodek podrážky zůstává na y + h2*1.25. */
function boot(ctx, x, y, len, h2, col) {
  const W2 = len * 1.5, H = h2 * 1.25;
  const path = (c) => {
    c.moveTo(x - W2 * 0.5, y + H);                 // pata dole
    c.lineTo(x - W2 * 0.6, y - H * 0.5);           // zadní hrana — rovný sek
    c.lineTo(x - W2 * 0.22, y - H * 0.95);         // horní lem
    c.lineTo(x + W2 * 0.3, y - H * 0.62);          // nárt (zlom)
    c.lineTo(x + W2 * 0.92, y - H * 0.4);          // hřbet ke špičce
    c.lineTo(x + W2 * 1.08, y - H * 0.05);         // zvednutá špička
    c.lineTo(x + W2 * 0.98, y + H * 0.62);         // čelo špičky
    c.lineTo(x + W2 * 0.42, y + H);                // podrážka
    c.closePath();
  };
  cel(ctx, path, { base: col, cx: x + W2 * 0.2, cy: y, r: W2, lw: 2.8 });
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;         // šev podrážky
  ctx.beginPath();
  ctx.moveTo(x - W2 * 0.48, y + H * 0.55);
  ctx.lineTo(x + W2 * 0.9, y + H * 0.45);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';                        // odlesk špičky
  ctx.beginPath();
  ctx.moveTo(x + W2 * 0.5, y - H * 0.45);
  ctx.lineTo(x + W2 * 0.94, y - H * 0.28);
  ctx.lineTo(x + W2 * 0.78, y + H * 0.05);
  ctx.lineTo(x + W2 * 0.44, y - H * 0.1);
  ctx.closePath(); ctx.fill();
}

/* trup: ramena → boky — LOMENÉ linie místo hladkých oblouků (CoMI/RtMI
   fazety): seknutá ramena, zalomený bok, cípatý lem kabátu. */
function torso(ctx, shY, hipY, wSh, wHip, belly, col, edge) {
  const midY = (shY + hipY) / 2, hh = hipY - shY;
  const path = (c) => {
    c.moveTo(-wSh, shY);
    c.lineTo(-wSh - belly, midY - hh * 0.1);       // lomený bok (loket fazety)
    c.lineTo(-wHip - belly * 0.4, hipY - hh * 0.12);
    c.lineTo(-wHip, hipY);
    c.lineTo(-wHip * 0.5, hipY + 10);              // cíp lemu
    c.lineTo(wHip * 0.06, hipY + 4);
    c.lineTo(wHip * 0.58, hipY + 11);              // druhý cíp
    c.lineTo(wHip, hipY);
    c.lineTo(wSh + belly, midY + hh * 0.08);
    c.lineTo(wSh, shY);
    c.lineTo(wSh * 0.52, shY - 10);                // seknuté rameno
    c.lineTo(-wSh * 0.48, shY - 11);
    c.closePath();
  };
  cel(ctx, path, {
    base: col, cx: 0, cy: midY, r: Math.max(wSh, wHip) + belly,
    lw: edge ? 3.4 : 2.8
  });
}

/* oči: bělmo + panenka, mrkání zavírá víčka */
function eyes(ctx, ex1, ex2, ey, r, blink, look) {
  const open = 1 - clamp(blink * 1.25, 0, 1);
  const lx = (look || 0.3) * r;
  if (open < 0.22) {
    ctx.strokeStyle = '#41281a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex1 - r, ey + 1); ctx.lineTo(ex1 + r, ey + 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2 - r * 0.9, ey + 1); ctx.lineTo(ex2 + r * 0.9, ey + 1); ctx.stroke();
    return;
  }
  ctx.fillStyle = '#f8f3e4';
  ctx.beginPath(); ctx.ellipse(ex1, ey, r, r * 1.18 * open, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ex2, ey, r * 0.92, r * 1.1 * open, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(ex1, ey, r, r * 1.18 * open, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(ex2, ey, r * 0.92, r * 1.1 * open, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = EYE_D;
